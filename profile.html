<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 我的</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--red:#f87171;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
        .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(139,137,255,.05);}
        .row:last-child{border:none;}.row .l{color:var(--dim);}.row .v{font-weight:600;font-family:monospace;}
        .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
        .b{background:rgba(10,10,26,.4);border-radius:10px;padding:12px;text-align:center;}
        .b .n{font-family:'Orbitron';font-size:18px;font-weight:800;color:var(--accent);}.b .l{font-size:11px;color:var(--dim);}
        .sec-t{font-size:14px;font-weight:700;margin-bottom:10px;}
        .cert{background:linear-gradient(135deg,rgba(26,58,26,.6),rgba(42,90,42,.3));border:1px solid rgba(74,222,128,.2);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;}
        .cert i{font-size:32px;color:var(--green);}
        .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}
        .btn-out{background:transparent;color:var(--red);border:1px solid var(--red);}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div class="card">
        <div class="row"><span class="l" data-i18n="wallet_addr">钱包地址</span><span class="v">0xABC1...23DEF</span></div>
        <div class="row"><span class="l" data-i18n="user_id">用户ID</span><span class="v">100235</span></div>
        <div class="row"><span class="l" data-i18n="role">身份</span><span class="v" data-i18n="student_role">学员</span></div>
        <div class="row"><span class="l" data-i18n="referrer">推荐人</span><span class="v">0x90F8...c9C1</span></div>
    </div>

    <div class="card">
        <div class="sec-t"><i class="ph-fill ph-coins"></i> <span data-i18n="my_assets">我的资产</span></div>
        <div class="grid3">
            <div class="b"><div class="n">720</div><div class="l" data-i18n="available_ace">可用ACE</div></div>
            <div class="b"><div class="n" style="color:var(--dim)">480</div><div class="l" data-i18n="locked_ace">锁定ACE</div></div>
            <div class="b"><div class="n" style="color:var(--green)">500U</div><div class="l">USDT</div></div>
        </div>
        <div style="font-size:12px;color:var(--dim);text-align:center"><span data-i18n="released_pct">已释放</span> 60%</div>
        <div style="height:6px;background:#333;border-radius:3px;margin-top:6px;overflow:hidden"><div style="height:100%;width:60%;background:linear-gradient(90deg,var(--accent),var(--green))"></div></div>
    </div>

    <div class="card">
        <div class="sec-t"><i class="ph-fill ph-certificate"></i> <span data-i18n="my_cert">我的证书</span></div>
        <div class="cert">
            <i class="ph-fill ph-seal-check"></i>
            <div><div style="font-weight:700;color:var(--green)" data-i18n="cert_title">AI应用认证</div><div style="font-size:11px;color:var(--dim)">ACE-20697-1 · <span data-i18n="courses_points">5门课 · 95分</span></div></div>
        </div>
    </div>

    <div class="card">
        <div class="sec-t"><i class="ph-fill ph-vault"></i> <span data-i18n="staking">质押生息</span></div>
        <div class="row"><span class="l" data-i18n="stake_amount">质押</span><span class="v">1,000 ACE · <span data-i18n="days_90">90天</span></span></div>
        <div class="row"><span class="l" data-i18n="annual_rate">年化</span><span class="v" style="color:var(--green)">10%</span></div>
        <button class="btn" data-i18n="staking">质押生息</button>
    </div>

    <div class="card">
        <div class="sec-t"><i class="ph-fill ph-medal"></i> <span data-i18n="holding_benefits">持有权益</span></div>
        <div class="row"><span class="l">1,200 ACE</span><span class="v" style="color:var(--green)" data-i18n="coupon95">课程9.5折</span></div>
        <div class="row"><span class="l" data-i18n="unlock5000">持有5,000 ACE解锁</span><span class="v"><span data-i18n="discount_community">课程9折+社群</span></span></div>
    </div>

    <button class="btn btn-out" data-i18n="apply_refund">申请退课</button>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script>initFrame('profile','profile');</script>
</body>
</html>
