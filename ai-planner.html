<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 专属学习规划师</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;padding-bottom:80px;}
        .chat{display:flex;flex-direction:column;gap:14px;}
        .msg{display:flex;gap:10px;align-items:flex-start;}
        .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .avatar i{color:#fff;font-size:18px;}
        .bubble{background:var(--card);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:12px 15px;max-width:100%;line-height:1.7;font-size:14px;width:100%;}
        .msg.user{flex-direction:row-reverse;}
        .msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px 14px 4px 14px;color:#fff;width:auto;max-width:85%;}
        .bubble b{color:var(--accent);}
        .msg.user .bubble b{color:#fff;}
        .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
        .chip{background:rgba(30,30,54,.9);border:1px solid var(--border);border-radius:16px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text);transition:all .2s;}
        .chip:hover{border-color:var(--accent);background:rgba(40,40,70,.9);color:var(--accent);}
        .free-input{flex:1;background:rgba(10,10,26,.6);border:1px solid var(--border);border-radius:10px;padding:12px;color:#fff;font-size:14px;outline:none;font-family:inherit;min-height:44px;}
        .input-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
        .send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:0 18px;cursor:pointer;font-size:16px;height:44px;}

        /* 方案卡片 */
        .plan-box{background:rgba(10,10,26,.4);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;}
        .plan-title{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
        .week{font-size:12px;color:var(--accent);font-weight:700;margin:8px 0 4px;}
        .course-item{display:flex;justify-content:space-between;background:rgba(20,20,40,.6);border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:13px;}
        .course-item .n{color:var(--dim);}
        .course-item .pts{color:var(--green);font-weight:600;}

        /* 报价卡 */
        .price-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
        .p-card{background:rgba(20,20,40,.6);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;}
        .p-card:hover{border-color:var(--accent);background:rgba(40,40,70,.6);}
        .p-card.hot{border-color:var(--green);}
        .p-name{font-size:12px;font-weight:700;color:var(--accent);}
        .p-price{font-family:'Orbitron';font-size:22px;font-weight:800;color:var(--green);margin:6px 0;}
        .p-desc{font-size:10px;color:var(--dim);line-height:1.5;}

        /* 人格画像 */
        .personality{border:1px solid var(--accent);background:rgba(139,137,255,.08);border-radius:12px;padding:14px;margin-top:10px;}
        .pname{font-size:15px;font-weight:800;color:var(--accent);}
        .pdesc{font-size:12px;color:var(--text);margin-top:6px;line-height:1.7;}

        /* 完成卡 */
        .done-box{background:linear-gradient(135deg,rgba(74,222,128,.1),rgba(34,197,94,.05));border:1px solid rgba(74,222,128,.2);border-radius:14px;padding:18px;text-align:center;margin-top:10px;}
        .done-box .big{font-size:22px;font-weight:800;color:var(--green);margin-bottom:8px;}
        .done-box .sub{font-size:13px;color:var(--text);line-height:1.8;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div id="chat" class="chat"></div>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="contracts-config.js"></script>
<script src="contracts-abi.js"></script>
<script src="dapp-tool.js"></script>
<script src="pricing-config.js"></script>
<script>
initFrame('learning','learn');
const chat=document.getElementById('chat');

// ===== 课程/方向数据 =====
const DIRECTIONS={
    'ai':{name:'AI应用',icon:'ph-robot',courses:['AI人人通','ChatGPT实战','AI做图片','AI做视频','AI办公']},
    'block':{name:'区块链/Web3',icon:'ph-currency-btc',courses:['区块链入门','钱包使用','DeFi基础','智能合约','NFT']},
    'ecom':{name:'跨境电商',icon:'ph-storefront',courses:['跨境电商入门','选品策略','店铺运营','物流支付','TikTok']},
    'mkt':{name:'数字营销',icon:'ph-megaphone',courses:['营销思维','社媒运营','内容创作','私域','数据分析']},
    'code':{name:'编程开发',icon:'ph-code',courses:['编程思维','Python','网页制作','AI编程','项目实战']},
};

// ===== 对话状态机 =====
let state={step:'welcome',dir:'ai',time:'1小时',basis:'零基础',goal:'',personality:'',plan:[]};

function addMsg(html,isUser){
    const d=document.createElement('div');
    d.className='msg'+(isUser?' user':'');
    d.innerHTML=`<div class="avatar"><i class="${isUser?'ph-fill ph-user':'ph-fill ph-sparkle'}"></i></div><div class="bubble">${html}</div>`;
    chat.appendChild(d);scrollBottom();
}
function addChips(chips,cb){
    cleanInputs();
    const d=document.createElement('div');d.className='msg';d.dataset.input='1';
    d.innerHTML=`<div class="avatar"><i class="ph-fill ph-sparkle"></i></div><div class="bubble"><div class="chips">${chips.map(c=>`<div class="chip">${c}</div>`).join('')}</div></div>`;
    d._cb=cb;
    d.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{d._cb(ch.textContent);});
    chat.appendChild(d);scrollBottom();
}
function addInput(cb,placeholder){
    cleanInputs();
    const d=document.createElement('div');d.className='msg';d.dataset.input='1';
    const uid='in'+Math.random().toString(36).slice(2,7);
    d.innerHTML=`<div class="avatar"><i class="ph-fill ph-sparkle"></i></div><div class="bubble"><div class="input-row"><input class="free-input" id="${uid}" placeholder="${placeholder||'输入你的想法...'}" onkeydown="if(event.key==='Enter')sendIn('${uid}')"><button class="send-btn" onclick="sendIn('${uid}')">→</button></div></div>`;
    d._cb=cb;d._uid=uid;
    chat.appendChild(d);scrollBottom();
    setTimeout(()=>{const el=document.getElementById(uid);if(el)el.focus();},100);
}
function sendIn(uid){
    const el=document.getElementById(uid);if(!el)return;
    const val=el.value.trim();if(!val)return;
    const d=el.closest('.msg');const cb=d._cb;
    cleanInputs();
    addMsg(val,true);
    setTimeout(()=>cb(val),300);
}
function cleanInputs(){document.querySelectorAll('.msg[data-input]').forEach(n=>n.remove());}
function scrollBottom(){chat.scrollTop=chat.scrollHeight;window.scrollTo(0,document.body.scrollHeight);}

// 方案卡片渲染
function planHTML(plan){
    let h='<div class="plan-box"><div class="plan-title"><i class="ph-fill ph-map-trifold"></i> 你的专属学习方案（'+state.dirName+'）</div>';
    plan.forEach((wk,i)=>{
        h+='<div class="week">第'+(i+1)+'周</div>';
        wk.forEach(c=>{h+=`<div class="course-item"><span>${c.name}</span><span class="pts">${c.pts}学分</span></div>`;});
    });
    h+='</div>';
    return h;
}

// ===== 对话流程 =====
function start(){
    addMsg(`你好！很高兴认识你 😊<br>我是你的<b>专属学习规划师</b>。<br><br>帮你<b>选对方向 → 定制路径 → 拿到证书</b>。<br><br>先聊聊：你最近<b>为什么想学</b>这些技能？`);
    addInput(v=>{state.goal=v;askTime();},'例如：想学AI做副业、转行、提升技能...');
}
function askTime(){
    addMsg(`我理解了，你想「${state.goal}」。<br><br>那<b>每天能抽出多少时间</b>学习呢？`);
    addChips(['30分钟/天','1小时/天','2小时以上'],t=>{state.time=t;addMsg(t,true);setTimeout(()=>askBasis(),300);});
}
function askBasis(){
    addMsg(`好，${state.time}，节奏很稳。<br><br><b>你之前接触过</b>这些领域吗？`);
    addChips(['完全零基础','有过一些了解','比较熟练'],t=>{state.basis=t;addMsg(t,true);setTimeout(()=>askDir(),300);});
}
function askDir(){
    addMsg(`了解！那咱们确定<b>学习方向</b>。<br><br><b>你最想突破哪方面？</b>`);
    addChips(Object.entries(DIRECTIONS).map(([k,v])=>v.name),t=>{
        state.dirName=t;
        state.dir=Object.keys(DIRECTIONS).find(k=>DIRECTIONS[k].name===t);
        addMsg(t,true);
        setTimeout(()=>askDetail(),300);
    });
}
function askDetail(){
    addMsg(`选<b>${state.dirName}</b>很有眼光，这个方向需求大、前景好！<br><br>最后：你<b>具体想实现什么目标</b>？（可自由输入，越具体方案越准）`);
    addInput(v=>{state.goalDetail=v;genPlan();},'例如：学会后接单变现、做自己的产品...');
}

// ===== 生成方案 =====
function genPlan(){
    addMsg('收到，正在为你生成专属方案，请稍等...');
    setTimeout(()=>{
        state.personality=genPersonality();
        state.plan=buildPlan();
        addMsg(`根据你的情况，你的<b>学习人格</b>是：`);
        addMsg(`<div class="personality"><div class="pname">${state.personality.type}</div><div class="pdesc">${state.personality.desc}<br>投入：${state.time}｜基础：${state.basis}｜目标：${state.goalDetail||state.goal}</div></div>`);
        setTimeout(()=>{
            addMsg(`这是为你定制的<b>3个月学习路径</b>（每个方向100学分，学完修满80分可持证）：`);
            addMsg(planHTML(state.plan));
            setTimeout(()=>{
                addMsg(`完成这套路径，你将：<br>✅ 独立掌握${state.dirName}<br>✅ 拿到<b>链上认证证书</b><br>✅ 修满100学分<br>✅ 获赠等值<b>ACE代币</b><br><br>你觉得这个方案<b>怎么样？</b>`);
                addChips(['方案很好，确定','我想调整一下','先看价格'],t=>{
                    addMsg(t,true);
                    setTimeout(()=>route(t),300);
                });
            },400);
        },400);
    },600);
}
function genPersonality(){
    let type='',desc='';
    if(state.time.includes('2小时')){type='冲刺高效型';desc='你时间投入足，适合快速推进、实战为主。';}
    else if(!state.time.includes('30')){type='稳健持续型';desc='每天1小时很稳定，适合循序渐进打好基础。';}
    else{type='碎片积累型';desc='碎片时间也能学，我们帮你把内容拆细，高效利用。';}
    return {type,desc};
}
function buildPlan(){
    const dir=DIRECTIONS[state.dir];
    const plan=[];let cur=[];
    dir.courses.forEach((c,i)=>{
        cur.push({name:c,pts:20});
        if(cur.length===2){plan.push([...cur]);cur=[];}
    });
    if(cur.length)plan.push(cur);
    return plan;
}

// ===== 路由：确认/调整/价格 =====
function route(choice){
    if(choice.includes('确定')){
        showPrice();
    }else if(choice.includes('调整')){
        askAdjust();
    }else if(choice.includes('价格')){
        showPrice();
    }
}
function askAdjust(){
    addMsg(`没问题，告诉我想<b>调整哪里</b>？可以：<br>①换方向（AI→区块链）<br>②改节奏（快/慢）<br>③加/减课程<br><br>直接说：`);
    addInput(v=>{handleAdjust(v);},'例如：换成区块链方向 / 学慢一点 / 把AI视频去掉');
}
function handleAdjust(input){
    let reply='';
    if(/区块链|区块链/.test(input)||input.includes('区块链')){state.dir='block';state.dirName=DIRECTIONS.block.name;reply='好的，换成<b>区块链/Web3</b>方向，重新规划。';}
    else if(input.includes('电商')){state.dir='ecom';state.dirName=DIRECTIONS.ecom.name;reply='好的，换成<b>跨境电商</b>方向，重新规划。';}
    else if(input.includes('营销')){state.dir='mkt';state.dirName=DIRECTIONS.mkt.name;reply='好的，换成<b>数字营销</b>方向。';}
    else if(input.includes('编程')||input.includes('开发')){state.dir='code';state.dirName=DIRECTIONS.code.name;reply='好的，换成<b>编程开发</b>方向。';}
    else if(input.includes('快')||input.includes('紧凑')){reply='好的，加快节奏，每周多学，缩短到2个月。';}
    else if(input.includes('慢')||input.includes('轻松')){reply='好的，放慢节奏，学扎实更重要，延长到4个月。';}
    else{reply='好的，我按你的需求调整了方案。';}

    addMsg(reply);
    state.plan=buildPlan();
    setTimeout(()=>{
        addMsg(`这是调整后的<b>新方案</b>：`);
        addMsg(planHTML(state.plan));
        setTimeout(()=>{
            addMsg('调整后的方案<b>满意吗？</b>');
            addChips(['确定这个方案','还要调整','看价格'],t=>{
                addMsg(t,true);
                setTimeout(()=>route(t),300);
            });
        },300);
    },400);
}

// ===== 报价 =====
function showPrice(){
    addMsg(`好的，下面是你选择的<b>${state.dirName}</b>方向的报价：`);
    addMsg(`<div class="price-grid">
        <div style="background:rgba(20,20,40,.6);border:1px solid var(--green);border-radius:12px;padding:14px;text-align:center"><div style="font-size:12px;font-weight:700;color:var(--green)">单门课</div><div style="font-family:Orbitron;font-size:22px;font-weight:800;color:var(--green);margin:6px 0">200U</div><div style="font-size:10px;color:var(--dim)">1门20学分<br>送等值ACE</div></div>
        <div style="background:rgba(20,20,40,.6);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center"><div style="font-size:12px;font-weight:700;color:var(--accent)">方向课程</div><div style="font-family:Orbitron;font-size:22px;font-weight:800;color:var(--green);margin:6px 0">200U</div><div style="font-size:10px;color:var(--dim)">1方向5门100学分<br>证书+ACE</div></div>
        <div style="background:rgba(20,20,40,.6);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center"><div style="font-size:12px;font-weight:700;color:var(--accent)">全部方向</div><div style="font-family:Orbitron;font-size:22px;font-weight:800;color:var(--green);margin:6px 0">200U</div><div style="font-size:10px;color:var(--dim)">全部方向终身<br>王牌认证</div></div>
    </div>`);
    setTimeout(()=>{
        addMsg('以上都包含<b>增值服务</b>：定制路径+测验+答疑+链上证书+ACE代币。<br><br><b>每方向统一价 200U，你想确认开始吗？</b>');
        addChips(['确认 购买 200U','先不着急'],t=>{
            addMsg(t,true);
            setTimeout(()=>finish(t),300);
        });
    },300);
}
function finish(choice){
    if(choice.includes('200U')){finalDone('方向课程 200U');}
    else if(choice.includes('不着急')){addMsg('没关系，你可以逛逛课程库，想清楚了随时来。');addChips(['去看课程','重新规划','问问题'],t=>{addMsg(t,true);setTimeout(()=>{
        if(t.includes('重新'))restart();
        else if(t.includes('课程'))location.href='course-library.html';
        else{ addMsg('当然可以！你还有什么想了解的？关于方向、课程、报价、学分都可以问我。'); addChips(['课程怎么安排','具体报价','学分怎么算','有其他问题'],t2=>{addMsg(t2,true);setTimeout(()=>{if(t2.includes('课程'))addMsg(`课程按方向分5门，每门20学分，学完拿方向证书。想了解直接点底部「课程」标签。`);else if(t2.includes('报价'))showPrice();else if(t2.includes('学分'))addMsg(`每个方向100学分，学完修满80分即可拿证，学分跟着课程累计，升级套餐不清零。`);else addMsg('没问题，还有什么尽管问！');addChips(['去看课程','重新规划'],t3=>{addMsg(t3,true);setTimeout(()=>{t3.includes('课程')?location.href='course-library.html':restart();},300);});},300);}); }},300);});}
}
function finalDone(pkg){
    addMsg(`<div class="done-box">
        <div class="big">🎉 方案确定完成！</div>
        <div class="sub"><b>选择：${pkg}</b><br>方向：${state.dirName}｜${state.time}｜${state.basis}<br><br>接下来：<br>① 注册/登录账户<br>② 绑定推荐人<br>③ 连接钱包支付<br>④ 开始你的学习之旅<br><br>祝你修满学分、拿到证书、赚到代币！🚀</div>
    </div>`);

    // 判断当前是否已登录(钱包已连接)
    const dirKey = state.dir || 'ai';
    setTimeout(() => {
        if (currentWallet) {
            // 已登录 → 直接去付费(购买该方向)
            addMsg(`检测到您已连接钱包 <b>${currentWallet.slice(0,8)}...</b>，可直接前往支付该方向课程。`);
            addChips(['立即支付','再看看'], t=>{
                addMsg(t,true);
                setTimeout(()=>{
                    if(t.includes('立即')) location.href='course-library.html?wallet='+currentWallet+'&dir='+dirKey;
                    else restart();
                },400);
            });
        } else {
            // 未登录 → 先去登录/注册
            addChips(['去登录','去注册'], t=>{
                addMsg(t,true);
                setTimeout(()=>{
                    if(t.includes('登录')) location.href='login.html';
                    else location.href=location.origin+location.pathname+'?ref='+(new URLSearchParams(location.search).get('ref')||CONTRACT_CONFIG.wallets.promo);
                },400);
            });
        }
    }, 100);
}
function restart(){location.reload();}

// 启动
start();
</script>
</body>
</html>
