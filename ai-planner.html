<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · AI学习规划师</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
        .tl{display:flex;gap:8px;align-items:center;}.tl img{width:34px;height:34px;border-radius:8px;}
        .lang{background:rgba(20,20,40,.8);border:1px solid var(--border);color:#ccc;padding:5px 10px;border-radius:8px;font-size:12px;outline:none;}
        .back-link{color:var(--accent);font-size:12px;text-decoration:none;}

        .chat-wrap{display:flex;flex-direction:column;}
        .msg{display:flex;gap:10px;margin-bottom:14px;}
        .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .avatar i{color:#fff;font-size:18px;}
        .bubble{background:var(--card);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:12px 14px;max-width:85%;}
        .msg.user{justify-content:flex-end;}
        .msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px 14px 4px 14px;}
        .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
        .opt{background:rgba(20,20,40,.6);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;text-align:left;}
        .opt:hover{border-color:var(--accent);background:rgba(30,30,54,.8);}
        .opt i{color:var(--accent);font-size:20px;display:block;margin-bottom:4px;}
        .ot{font-size:13px;font-weight:600;}
        .od{font-size:11px;color:var(--dim);margin-top:2px;}
        .opt-full{grid-column:1/-1;text-align:center;}
        .opt.sel{border-color:var(--green);background:rgba(74,222,128,.08);}
        .free-input{width:100%;background:rgba(10,10,26,.6);border:1px solid var(--border);border-radius:10px;padding:12px;color:#fff;font-size:14px;outline:none;margin-top:10px;font-family:inherit;resize:none;}
        .input-row{display:flex;gap:8px;margin-top:10px;}
        .free-input2{flex:1;background:rgba(10,10,26,.6);border:1px solid var(--border);border-radius:10px;padding:12px;color:#fff;font-size:14px;outline:none;font-family:inherit;resize:none;}
        .send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:0 18px;cursor:pointer;font-size:16px;}
        .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;}
        .btn-out{background:transparent;color:var(--accent);border:1px solid var(--accent);}
        .plan-card{background:rgba(10,10,26,.4);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
        .pw{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px;}
        .pt{font-size:13px;font-weight:600;}
        .pm{font-size:11px;color:var(--dim);margin-top:2px;}
        .plan-actions{display:flex;gap:8px;margin-top:12px;}
        .plan-actions .btn{flex:1;margin-top:0;}
        .book-link{font-size:11px;color:var(--accent);margin-top:6px;text-decoration:none;display:inline-block;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    
    </div>

    <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:18px;font-weight:800"><i class="ph-fill ph-brain" style="color:var(--accent)"></i> AI学习规划师</div>
    </div>

    <div class="chat-wrap" id="chat">
        <!-- 动态生成 -->
    </div>
</div>

<script src="i18n.js"></script>
<script src="frame.js"></script>
<script>initFrame("learning","learn");</script>


<script>
// 课程数据
const COURSES = {
    ai: [
        {t:'AI人人通 — 什么是AI',d:'3小时 · 入门',url:'https://www.bilibili.com/video/BV1uNk1YxEJQ/'},
        {t:'ChatGPT实战 — 提示词',d:'4小时 · 入门',url:'https://www.bilibili.com/video/BV1FvXLYSEQj/'},
        {t:'AI做图片 — MJ/SD',d:'3小时 · 进阶',url:'https://www.bilibili.com/video/BV1RL4y1T7qK/'},
        {t:'AI做视频 — 剪映AI',d:'3小时 · 进阶',url:'https://www.bilibili.com/video/BV1KJYrz4Epm/'},
        {t:'AI办公 — PPT/Excel',d:'4小时 · 进阶',url:'https://www.bilibili.com/video/BV1xwVr6FEh4/'},
    ],
    block: [
        {t:'区块链入门 — 比特币',d:'3小时 · 入门',url:'https://www.bilibili.com/video/BV1RL4y1T7qK/'},
        {t:'钱包使用 — MetaMask',d:'2小时 · 入门',url:'https://www.bilibili.com/video/BV1RL4y1T7qK/'},
        {t:'DeFi基础',d:'3小时 · 进阶',url:'https://learnblockchain.cn/courses'},
        {t:'智能合约 — Solidity',d:'5小时 · 高级',url:'https://learnblockchain.cn/article/4376'},
        {t:'NFT与数字资产',d:'3小时 · 进阶',url:'https://learnblockchain.cn/courses'},
    ],
    ecom: [
        {t:'跨境电商入门',d:'3小时 · 入门',url:'https://www.bilibili.com/video/BV1RYqHYnEw8/'},
        {t:'选品策略',d:'3小时 · 进阶',url:'https://www.bilibili.com/video/BV1qG4y1s7G3/'},
        {t:'店铺运营',d:'4小时 · 进阶',url:'https://www.bilibili.com/video/BV1jM4y1w7Fj/'},
        {t:'物流与支付',d:'2小时 · 入门',url:'https://www.bilibili.com/video/BV1RYqHYnEw8/'},
        {t:'TikTok带货',d:'4小时 · 进阶',url:'https://www.bilibili.com/video/BV1jM4y1w7Fj/'},
    ],
    mkt: [
        {t:'营销思维',d:'3小时 · 入门',url:'https://www.coursera.org/courses?query=digital+marketing'},
        {t:'社交媒体运营',d:'4小时 · 进阶',url:'https://www.bilibili.com/video/BV1uNk1YxEJQ/'},
        {t:'内容创作',d:'3小时 · 进阶',url:'https://www.bilibili.com/video/BV1FvXLYSEQj/'},
        {t:'私域流量',d:'3小时 · 进阶',url:'https://www.bilibili.com/video/BV1qG4y1s7G3/'},
        {t:'数据分析',d:'4小时 · 高级',url:'https://www.coursera.org/courses?query=data+analytics'},
    ],
    code: [
        {t:'编程思维',d:'3小时 · 入门',url:'https://www.khanacademy.org/computing'},
        {t:'Python基础',d:'5小时 · 进阶',url:'https://www.bilibili.com/video/BV1Jgf6YvE8e/'},
        {t:'网页制作',d:'5小时 · 进阶',url:'https://www.freecodecamp.org/chinese/'},
        {t:'AI辅助编程',d:'3小时 · 进阶',url:'https://www.bilibili.com/video/BV1xwVr6FEh4/'},
        {t:'项目实战',d:'6小时 · 高级',url:'https://www.freecodecamp.org/chinese/'},
    ],
};
const DIR_NAMES={ai:'AI应用',block:'区块链/Web3',ecom:'跨境电商',mkt:'数字营销',code:'编程入门'};

let step=0, answers={}, plan=[];
const chat=document.getElementById('chat');

function addMsg(text, isUser){
    const d=document.createElement('div');
    d.className='msg'+(isUser?' user':'');
    d.innerHTML=`<div class="avatar"><i class="${isUser?'ph-fill ph-user':'ph-fill ph-sparkle'}"></i></div><div class="bubble">${text}</div>`;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
    return d;
}
function addOpts(optsArr, cb){
    const d=document.createElement('div');
    d.className='msg';
    d.innerHTML=`<div class="avatar"><i class="ph-fill ph-sparkle"></i></div><div class="bubble"><div class="opts" id="optGroup"></div></div>`;
    chat.appendChild(d);
    const g=d.querySelector('#optGroup');
    optsArr.forEach(o=>{
        const b=document.createElement('div');
        b.className='opt'+(o.full?' opt-full':'');
        b.innerHTML=`<i class="ph ${o.icon}"></i><div class="ot">${o.title}</div>${o.desc?`<div class="od">${o.desc}</div>`:''}`;
        b.onclick=()=>{
            g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
            b.classList.add('sel');
            setTimeout(()=>cb(o),300);
        };
        g.appendChild(b);
    });
    chat.scrollTop=chat.scrollHeight;
}
function addFree(ph, cb, allowSkip){
    const row=document.createElement('div');
    row.className='msg';
    row.innerHTML=`<div class="avatar"><i class="ph-fill ph-sparkle"></i></div><div class="bubble"><input class="free-input2" id="freeInput" placeholder="${ph}"><div class="input-row"><button class="send-btn" id="freeSend">→</button></div></div>`;
    chat.appendChild(row);
    const send=()=>{const v=document.getElementById('freeInput').value.trim(); if(!v&&!allowSkip)return; cb(v||'跳过');};
    document.getElementById('freeSend').onclick=send;
    document.getElementById('freeInput').addEventListener('keypress',e=>{if(e.key==='Enter')send();});
    chat.scrollTop=chat.scrollHeight;
}

// 问题流程
function askQ(n){
    const q=[{
        type:'opts', text:'你想学什么方向？', options:[
            {icon:'ph-robot',title:'AI应用',desc:'ChatGPT·AI绘画·AI视频',val:'ai'},
            {icon:'ph-currency-btc',title:'区块链/Web3',desc:'钱包·DeFi·合约',val:'block'},
            {icon:'ph-storefront',title:'跨境电商',desc:'亚马逊·TikTok',val:'ecom'},
            {icon:'ph-megaphone',title:'数字营销',desc:'社媒·内容·私域',val:'mkt'},
            {icon:'ph-code',title:'编程入门',desc:'Python·网页',val:'code',full:true},
        ]
    },{
        type:'opts', text:'你的基础怎么样？', options:[
            {icon:'ph-seedling',title:'零基础',val:'zero'},
            {icon:'ph-tree',title:'有一些了解',val:'some'},
            {icon:'ph-tree-evergreen',title:'比较熟练',val:'pro',full:true},
        ]
    },{
        type:'opts', text:'你的目标是？', options:[
            {icon:'ph-briefcase',title:'找工作',val:'job'},
            {icon:'ph-rocket-launch',title:'创业',val:'biz'},
            {icon:'ph-chart-line-up',title:'提升技能',val:'skill'},
            {icon:'ph-heart',title:'兴趣',val:'interest',full:true},
        ]
    },{
        type:'opts', text:'每天能学多久？', options:[
            {icon:'ph-clock',title:'30分钟',val:'30'},
            {icon:'ph-clock',title:'1小时',val:'60'},
            {icon:'ph-clock',title:'2小时+',val:'120',full:true},
        ]
    },{
        type:'free', text:'具体想学什么？（可跳过）', ph:'输入你的想法...', skip:true,
    }];

    if(n>=q.length){genPlan();return;}
    const cur=q[n];
    step=n;
    addMsg(cur.text);
    if(cur.type==='opts') addOpts(cur.options, o=>{answers[n]=o.val;addMsg(o.title,true);setTimeout(()=>askQ(n+1),300);});
    else addFree(cur.ph, v=>{answers[n]=v;addMsg(v,true);setTimeout(()=>askQ(n+1),300);}, cur.skip);
}

function genPlan(){
    const dir=answers[0];
    const courses=COURSES[dir]||[];
    const startIdx = answers[1]==='zero'?0 : answers[1]==='some'?1:2;
    const perWeek = answers[3]==='30'?1 : answers[3]==='60'?2:3;
    plan=[]; let wk=1, buf=[];
    for(let i=startIdx;i<courses.length;i++){
        buf.push(courses[i]);
        if(buf.length>=perWeek||i===courses.length-1){plan.push({week:wk,courses:[...buf]});buf=[];wk++;}
    }
    addMsg('计划生成！');
    plan.forEach(w=>{
        const d=document.createElement('div');d.className='msg';
        let html=`<div class="avatar"><i class="ph-fill ph-clipboard-text"></i></div><div class="bubble">`;
        html+=`<div class="pw">第${w.week}周</div>`;
        w.courses.forEach(c=>{
            html+=`<div class="plan-card"><div class="pt">${c.t}</div><div class="pm">${c.d}</div><a href="${c.url}" target="_blank" class="book-link">去学习 →</a></div>`;
        });
        html+=`</div>`;
        d.innerHTML=html;chat.appendChild(d);
    });
    const actions=document.createElement('div');actions.className='msg';
    actions.innerHTML=`<div class="avatar"><i class="ph-fill ph-check"></i></div><div class="bubble"><div class="plan-actions"><button class="btn" onclick="confirmPlan()">确认方案</button><button class="btn btn-out" onclick="location.reload()">重新规划</button></div></div>`;
    chat.appendChild(actions);
    chat.scrollTop=chat.scrollHeight;
}
function confirmPlan(){
    addMsg('方案已确认！付费5,000U（至尊）或500U（单门）后即可开始学习。');
    addMsg('你学完了我建议的这门课了吗？',true);
}
askQ(0);
</script>
</body>
</html>
