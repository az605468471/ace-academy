<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · AI学习规划师</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;padding-bottom:80px;}
        .chat-section{display:flex;flex-direction:column;gap:14px;}
        .msg{display:flex;gap:10px;align-items:flex-start;}
        .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .avatar i{color:#fff;font-size:18px;}
        .bubble{background:var(--card);border:1px solid var(--border);border-radius:14px 14px 14px 4px;padding:12px 15px;max-width:85%;line-height:1.6;font-size:14px;}
        .msg.user{flex-direction:row-reverse;}
        .msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px 14px 4px 14px;color:#fff;}
        .bubble b{color:var(--accent);}
        .msg.user .bubble b{color:#fff;}
        .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
        .chip{background:rgba(30,30,54,.8);border:1px solid var(--border);border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text);transition:all .2s;}
        .chip:hover{border-color:var(--accent);background:rgba(40,40,70,.8);}
        .free-input{flex:1;background:rgba(10,10,26,.6);border:1px solid var(--border);border-radius:10px;padding:12px;color:#fff;font-size:14px;outline:none;font-family:inherit;resize:none;min-height:44px;}
        .input-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
        .send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:0 18px;cursor:pointer;font-size:16px;height:44px;}
        .typing{dot}
        .plan-card{background:rgba(10,10,26,.4);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
        .pw{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px;}
        .pt{font-size:13px;font-weight:600;}
        .pm{font-size:11px;color:var(--dim);margin-top:2px;}
        .personality{border:1px solid var(--accent);background:rgba(139,137,255,.08);border-radius:12px;padding:14px;margin-top:10px;}
        .personality .pname{font-size:15px;font-weight:800;color:var(--accent);}
        .personality .pdesc{font-size:12px;color:var(--text);margin-top:6px;line-height:1.6;}
        .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin:8px 6px 0 0;}
        .btn-out{background:transparent;color:var(--accent);border:1px solid var(--accent);}
        .radar{max-width:180px;margin:0 auto;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div id="chat" class="chat-section"></div>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script>
initFrame('learning','learn');
const chat=document.getElementById('chat');
let step=0;
let profile={goals:[],time:'',basis:'',direction:'',freeInput:''};

function addMsg(text,isUser){
    const d=document.createElement('div');
    d.className='msg'+(isUser?' user':'');
    d.innerHTML=`<div class="avatar"><i class="${isUser?'ph-fill ph-user':'ph-fill ph-sparkle'}"></i></div><div class="bubble">${text}</div>`;
    chat.appendChild(d);
    scrollBottom();
    return d;
}
function addChips(chips,cb){
    const d=document.createElement('div');
    d.className='msg';
    let html='<div class="bubble"><div class="chips">';
    chips.forEach((c,i)=>html+=`<div class="chip" onclick="pickChip(this,${i})">${c}</div>`);
    html+='</div></div>';
    d.dataset.cb='';
    d.innerHTML=html;
    chat.appendChild(d);
    d._cb=cb;
    d.dataset.input='1';
    scrollBottom();
    return d;
}
function pickChip(el,idx){
    const d=el.closest('.msg');
    const cb=d._cb;
    removeOldInputs();
    cb(el.textContent);
}
function addInput(cb){
    removeOldInputs();
    const d=document.createElement('div');
    d.className='msg';d.dataset.input='1';
    const uid='freeIn'+Math.random().toString(36).slice(2,7);
    d.innerHTML=`<div class="avatar"><i class="ph-fill ph-sparkle"></i></div><div class="bubble" style="width:100%"><div class="input-row"><input class="free-input" id="${uid}" onkeydown="if(event.key==='Enter')submitIn('${uid}')"><button class="send-btn" onclick="submitIn('${uid}')">→</button></div></div>`;
    d._cb=cb;d._uid=uid;
    chat.appendChild(d);
    scrollBottom();
    setTimeout(()=>{const el=document.getElementById(uid);if(el)el.focus();},100);
}
function removeOldInputs(){
    document.querySelectorAll('.msg[data-input]').forEach(n=>n.remove());
}
function submitIn(uid){
    const el=document.getElementById(uid);
    if(!el) return;
    const val=el.value.trim();
    if(!val) return;
    const msg=el.closest('.msg');
    const cb=msg._cb;
    removeOldInputs();
    addMsg(val,true);
    setTimeout(()=>cb(val),300);
    scrollBottom();
}
function scrollBottom(){chat.scrollTop=chat.scrollHeight;window.scrollTo(0,document.body.scrollHeight);}

// 破冰
function start(){
    addMsg(`你好！很高兴认识你 😊<br>我是你的<b>专属学习规划师</b>，不是来给你填表格的，而是想真正了解你，然后帮你<b>拿到结果</b>。<br><br>先聊聊：<b>你最近为什么想学AI/区块链/电商这些？</b>`);
    addInput(v=>{profile.goals.push('起步');askMore1(v);});
}
function askMore1(v){
    profile.goals.push(v);
    addMsg(`我明白了，你说的「${v}」我能理解。<br>很多人都是这样的，<b>想改变但不知道从哪开始</b>。<br><br>我想再深入一点：你现在每天大概能抽出多少时间学习？`);
    addChips(['30分钟/天','1小时/天','2小时以上','看情况'],t=>{
        profile.time=t;
        addMsg(t,true);
        setTimeout(()=>askBasis(),300);
    });
}
function askBasis(){
    addMsg(`好的，${profile.time}，这个节奏很稳。<br><br>接下来：你之前接触过这些领域吗？比如<a>钱包</a>、AI工具之类？`);
    addChips(['完全没接触','用过一点','比较熟练'],t=>{
        profile.basis=t;
        addMsg(t,true);
        setTimeout(()=>askDirection(),300);
    });
}
function askDirection(){
    addMsg(`了解！那咱们聊聊方向。<br><b>你最想突破的是哪方面？</b>`);
    addChips(['AI / 智能工具','区块链 / Web3','跨境电商','数字营销','编程开发'],t=>{
        profile.direction=t;
        addMsg(t,true);
        setTimeout(()=>askDetail(),300);
    });
}
function askDetail(){
    addMsg(`选${profile.direction}很有眼光，这方向需求大、前景好。<br><br>最后告诉我：你<b>具体想实现什么？</b>（可以自由说，越具体越好）<br>比如："想学会用AI做副业变现"或"想把产品卖到海外"`);
    addInput(v=>{profile.freeInput=v;finish();});
}

// 生成人格画像 + 方案
function genPersonality(){
    let type='行动派实干家', desc='';
    if(profile.time.includes('2小时')||profile.time.includes('2小时以上')){type='冲刺型高效者';desc='你时间投入足，适合快速推进、多动手实践。';}
    else if(profile.freeInput.includes('副业')||profile.freeInput.includes('变现')||profile.freeInput.includes('赚钱')){type='变现导向型';desc='你目标明确，想快速看到结果，适合项目制学习+实战。';}
    else if(profile.basis.includes('没用')||profile.basis.includes('完全')){type='稳健起步型';desc='你从零开始但很认真，适合循序渐进、打好基础。';}
    else if(profile.basis.includes('熟练')){type='进阶突破型';desc='你有基础，适合直接挑战实战和进阶内容。';}
    else{type='思考者型';desc='你习惯先想清楚再行动，适合理解原理再实践。';}
    return {type,desc};
}

function genPlan(dir){
    const plans={
        'AI / 智能工具':['AI人人通','ChatGPT实战','AI做图片','AI做视频','AI办公'],
        '区块链 / Web3':['区块链入门','钱包使用','DeFi基础','智能合约','NFT'],
        '跨境电商':['跨境电商入门','选品策略','店铺运营','物流支付','TikTok'],
        '数字营销':['营销思维','社媒运营','内容创作','私域','数据分析'],
        '编程开发':['编程思维','Python','网页制作','AI编程','项目实战'],
    };
    return plans[dir]||plans['AI / 智能工具'];
}

function radarSvg(percent){
    return `<div class="radar"><svg viewBox="0 0 100 100">
        <polygon points="50,5 88,25 88,75 50,95 12,75 12,25" fill="rgba(139,137,255,.1)" stroke="rgba(139,137,255,.3)"/>
        <polygon points="50,5 88,25 88,75 50,95 12,75 12,25" fill="rgba(139,137,255,.3)" stroke="#8b89ff" stroke-width="2" transform="scale(${percent/100}) translate(${100-percent},${100-percent})"/>
        <text x="50" y="52" text-anchor="middle" font-size="14" fill="#4ade80" font-weight="700">${percent}%</text>
      </svg></div>`;
}

function finish(){
    const p=genPersonality();
    addMsg('收到！让我为你生成专属方案。<br>请稍等一会儿...');
    setTimeout(()=>{
        // 人格画像
        addMsg(`根据你的回答，我给你做了一个<b>学习人格画像</b>：`);
        const per=addMsg(`<div class="personality">
            <div class="pname">${p.type}</div>
            <div class="pdesc">${p.desc} 你的学习档案：<br>投入：${profile.time}｜基础：${profile.basis}｜方向：${profile.direction}</div>
        </div>`,false);
        setTimeout(()=>{
            // 方案
            const courses=genPlan(profile.direction);
            addMsg(`基于你的情况，这是你的<b>3个月专属学习路径</b>（完成即修满该方向100学分）：`);
            courses.forEach((c,i)=>{
                const week=Math.floor(i/2)+1;
                addMsg(`<div class="plan-card">
                    <div class="pw">第${week}周</div>
                    <div class="pt">${i+1}. ${c}</div>
                    <div class="pm">目标：掌握XXX</div>
                </div>`);
            });
            setTimeout(()=>{
                addMsg(`完成这套路径，你将：<br>✅ 独立完成该方向项目<br>✅ 拿到<b>链上认证证书</b><br>✅ 修满<b>100学分</b><br>✅ 获赠等值<b>ACE代币</b><br><br>你觉得这个方案符合你的预期吗？`);
                addChips(['确认，开始学习','想调整一下','先了解价格'],t=>{
                    addMsg(t,true);
                    setTimeout(()=>ending(t),300);
                });
            },400);
        },400);
    },600);
}
function ending(choice){
    if(choice.includes('确认')){
        addMsg(`太棒了！你的方案已锁定。<br>单门课500U / 方向套餐1500U（5门全含）/ 至尊5000U（全部+终身）。<br>随时可以开始，3个月内修满80分即可持证。`);
    }else if(choice.includes('调整')){
        addMsg(`没问题，你的调整我来处理。<br><br>你可以告诉我想调整哪些，比如：<br>① <b>换方向</b>（AI→区块链）<br>② <b>改节奏</b>（每周多学/少学）<br>③ <b>加内容</b>（想多学某一块）<br>④ <b>减课程</b>（某门课不想要）<br><br>直接跟我说就行：`);
        addInput(v=>{handleAdjust(v);});
    }else if(choice.includes('价格')||choice.includes('了解')){
        addMsg(`告诉你三个价位：<br>单门课 <b>500U</b>（送等值ACE）<br>方向套餐 <b>1500U</b>（含5门+证书）<br>至尊 <b>5000U</b>（全部方向+终身）<br>课程都是增值服务：路径+测验+答疑+证书，不是简单链接。<br><br>需要我根据你的预算推荐吗？`);
        addChips(['推荐下性价比','还是先学起来','再想想'],t=>{
            addMsg(t,true);
            setTimeout(()=>ending(t),300);
        });
    }
}

function handleAdjust(input){
    // 识别调整意图
    let reply='';
    if(input.includes('方向')||input.includes('区块链')||input.includes('电商')||input.includes('营销')||input.includes('编程')){
        reply=`明白了，你想调整方向。<br>我可以帮你重新规划一个新的学习路径，把课程按新方向排好。<br>要不要我现在就重新生成？`;
    }else if(input.includes('节奏')||input.includes('时间')||input.includes('快')||input.includes('慢')){
        reply=`收到，调整学习节奏没问题。<br>想更紧凑还是更轻松都可以，<b>学分和证书标准不变</b>，3个月内修满80分即可。<br>要我现在调整学习周期计划吗？`;
    }else if(input.includes('加')||input.includes('多学')||input.includes('增加')){
        reply=`想多学没问题的，可以顺延方向往深了学，<b>学分能累计</b>，不会浪费。<br>建议先把当前方向修满，再加新方向，拿更多证书和学分。<br>要我重新规划吗？`;
    }else{
        reply=`收到你的调整需求了（${input}）。<br>我已经记下来，会在最终方案中体现。<br>如果你还想改别的，也可以继续告诉我，或者咱们先这样，然后进入确认报价？`;
    }
    addMsg(reply);
    addChips(['确认调整，重新生成','先按这个来','还要继续改'],t=>{
        addMsg(t,true);
        setTimeout(()=>adjustNext(t),300);
    });
}

function adjustNext(t){
    if(t.includes('重新')){
        addMsg('好的，方案已重新生成！<br>学分/证书/代币标准不变，按你调整后的路径学习即可。<br>准备好了就可以开始，选一门课报名就行。');
    }else if(t.includes('继续改')){
        addMsg('请告诉我还想调整什么？');
        addInput(v=>{handleAdjust(v);});
    }else{
        addMsg('好，方案确定！<br>随时可以报名开课，祝你学有所成 🎓');
        addChips(['去选课','看看价格','问别的'],t2=>{addMsg(t2,true);setTimeout(()=>ending(t2),300);});
    }
}
start();
</script>
</body>
</html>
