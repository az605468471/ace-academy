<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 交易市场</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--red:#f87171;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;padding-bottom:80px;}
        .price-card{background:linear-gradient(135deg,rgba(30,30,54,.9),rgba(42,42,90,.6));border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;margin-bottom:14px;}
        .price-label{font-size:12px;color:var(--dim);}
        .price-val{font-family:'Orbitron';font-size:36px;font-weight:800;color:var(--green);}
        .price-change{color:var(--green);font-size:13px;margin-top:4px;}
        .price-stats{display:flex;justify-content:space-around;margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
        .ps .v{font-size:13px;font-weight:700;}.ps .l{font-size:11px;color:var(--dim);}
        .bal-row{display:flex;gap:10px;margin-bottom:14px;}
        .bal{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
        .bal-num{font-family:'Orbitron';font-size:18px;font-weight:800;color:var(--accent);}.bal-label{font-size:11px;color:var(--dim);}
        .trade-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
        .trade-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
        .trade-title .tl{display:flex;align-items:center;gap:6px;}
        .input-row{display:flex;align-items:center;background:rgba(10,10,26,.6);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
        .input-box{flex:1;background:transparent;border:none;padding:13px;color:#fff;font-size:15px;outline:none;font-family:inherit;min-width:0;}
        .input-unit{padding:0 13px;color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap;}
        .max-btn{background:var(--accent);border:none;color:#fff;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;border-radius:24px;margin-right:8px;}
        .info{background:rgba(10,10,26,.4);border-radius:8px;padding:10px;margin-bottom:10px;}
        .info-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
        .info-row .l{color:var(--dim);}.info-row .v{font-weight:600;}
        .info-row .v.grn{color:var(--green);}
        .btn-buy,.btn-sell{width:100%;color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
        .btn-buy{background:linear-gradient(135deg,#16a34a,#22c55e);}
        .btn-sell{background:linear-gradient(135deg,#dc2626,#ef4444);}
        .btn-buy:disabled,.btn-sell:disabled{opacity:.4;cursor:not-allowed;}
        /* 确认弹窗 */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
        .overlay.show{display:flex;}
        .modal{background:linear-gradient(160deg,rgba(30,30,54,.98),rgba(20,20,40,.98));border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
        .modal-title{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .modal-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(139,137,255,.08);}
        .modal-row .l{color:var(--dim);}.modal-row .v{font-weight:700;}
        .fee-note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.6;}
        .modal-btns{display:flex;gap:10px;margin-top:18px;}
        .modal-btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;}
        .modal-btn-ok{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
        .modal-btn-cancel{background:rgba(255,255,255,.08);color:var(--text);}
        /* 成功弹窗 */
        .success-overlay .modal{text-align:center;}
        .success-icon{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:32px;color:#fff;box-shadow:0 8px 30px rgba(74,222,128,.4);}
        .success-title{font-size:18px;font-weight:800;margin-bottom:6px;}
        .success-sub{font-size:13px;color:var(--dim);line-height:1.7;margin-bottom:16px;}
        .success-bal{background:rgba(10,10,26,.5);border-radius:10px;padding:12px;font-size:12px;color:var(--dim);line-height:1.8;text-align:left;}
        .success-bal b{color:var(--accent);}
        .demo-tip{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--dim);margin:10px 0 0;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

    <div class="price-card">
        <div class="price-label" data-i18n="ace_price">ACE价格</div>
        <div class="price-val" id="priceVal">0.1 <span style="font-size:16px">U</span></div>
        <div class="price-change">+2.3% (24h)</div>
        <div class="price-stats">
            <div class="ps"><div class="v">8,500U</div><div class="l" data-i18n="pool">底池</div></div>
            <div class="ps"><div class="v">15,000</div><div class="l" data-i18n="burned">已销毁</div></div>
            <div class="ps"><div class="v">9,985,000</div><div class="l" data-i18n="total_supply">总量</div></div>
        </div>
    </div>

    <div class="bal-row">
        <div class="bal"><div class="bal-num" id="balAce">2,000</div><div class="bal-label">ACE</div></div>
        <div class="bal"><div class="bal-num" id="balUsdt">500<span style="font-size:12px">U</span></div><div class="bal-label">USDT</div></div>
    </div>

    <!-- 买入 -->
    <div class="trade-card">
        <div class="trade-title"><span class="tl" style="color:var(--green)"><i class="ph-fill ph-arrow-down-left"></i> <span data-i18n="buy_ace">买入ACE</span></span></div>
        <div class="input-row">
            <input type="number" class="input-box" id="buyInput" placeholder="0" min="0">
            <style>.input-row .unit{color:var(--accent);font-weight:700;font-size:13px;padding:0 8px;white-space:nowrap;}</style>
            <span class="unit">USDT</span>
            <button class="max-btn" onclick="setMax('buy')">MAX</button>
        </div>
        <div class="info">
            <div class="info-row"><span class="l" data-i18n="expected_gain">预计获得</span><span class="v grn" id="buyResult">-- ACE</span></div>
            <div class="info-row"><span class="l">1 ACE =</span><span class="v" id="priceLine">0.1 U</span></div>
        </div>
        <button class="btn-buy" id="buyBtn" onclick="confirmTrade('buy')"><span data-i18n="buy_ace">买入ACE</span></button>
    </div>

    <!-- 卖出 -->
    <div class="trade-card">
        <div class="trade-title"><span class="tl" style="color:var(--red)"><i class="ph-fill ph-arrow-up-right"></i> <span data-i18n="sell_ace">卖出ACE</span></span></div>
        <div class="input-row">
            <input type="number" class="input-box" id="sellInput" placeholder="0" min="0">
            <span class="unit">ACE</span>
            <button class="max-btn" onclick="setMax('sell')">MAX</button>
        </div>
        <div class="info">
            <div class="info-row"><span class="l" data-i18n="expected_gain">预计获得</span><span class="v grn" id="sellResult">-- USDT</span></div>
            <div class="info-row"><span class="l" data-i18n="fee">手续费(2%)</span><span class="v" id="sellFee">--</span></div>
            <div class="info-row"><span class="l" data-i18n="burn_share">销毁1.5%</span><span class="v" id="sellBurn">--</span></div>
            <div class="info-row"><span class="l" data-i18n="charity_share">公益0.5%</span><span class="v" id="sellCharity">--</span></div>
        </div>
        <button class="btn-sell" id="sellBtn" onclick="confirmTrade('sell')"><span data-i18n="sell_ace">卖出ACE</span></button>
    </div>

    <div class="demo-tip"><i class="ph ph-info"></i><span data-i18n="gas_tip">(模拟演示，未连接合约)</span></div>
</div>

<!-- 确认弹窗 -->
<div class="overlay" id="confirmOverlay">
    <div class="modal">
        <div class="modal-title" id="confirmTitle"><i class="ph-fill ph-arrow-down-left"></i> <span data-i18n="confirm_buy">确认买入</span></div>
        <div class="modal-row"><span class="l" id="confirmRow1L" data-i18n="pay_usdt">支付</span><span class="v" id="confirmRow1"></span></div>
        <div class="modal-row"><span class="l" id="confirmRow2L" data-i18n="expected_gain">预计获得</span><span class="v" id="confirmRow2"></span></div>
        <div class="modal-row" id="confirmRow3Wrap"><span class="l" data-i18n="fee">手续费</span><span class="v" id="confirmRow3"></span></div>
        <div class="modal-row" id="confirmRow4Wrap"><span class="l" data-i18n="burn_share">销毁1.5%</span><span class="v" id="confirmRow4"></span></div>
        <div class="modal-row" id="confirmRow5Wrap"><span class="l" data-i18n="charity_share">公益0.5%</span><span class="v" id="confirmRow5"></span></div>
        <div class="fee-note" id="confirmNote"></div>
        <div class="modal-btns">
            <button class="modal-btn modal-btn-cancel" onclick="closeOverlay('confirmOverlay')"><span data-i18n="cancel_trade">取消交易</span></button>
            <button class="modal-btn modal-btn-ok" id="confirmOk" onclick="executeTrade()"><span data-i18n="confirm">确认</span></button>
        </div>
    </div>
</div>

<!-- 成功弹窗 -->
<div class="overlay success-overlay" id="successOverlay">
    <div class="modal">
        <div class="success-icon"><i class="ph-fill ph-check"></i></div>
        <div class="success-title" id="successTitle"><span data-i18n="trade_success">交易成功</span></div>
        <div class="success-sub" id="successSub"></div>
        <div class="success-bal" id="successBal"></div>
        <div class="modal-btns">
            <button class="modal-btn modal-btn-ok" onclick="closeOverlay('successOverlay')"><span data-i18n="continue_trade">继续交易</span></button>
        </div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="frame.js"></script>
<script src="trade-app.js"></script>
<script>
    initFrame('trade','trade');
    initTradeApp();
</script>
</body>
</html>
