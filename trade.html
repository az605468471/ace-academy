<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 交易市场</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--red:#f87171;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;}
        .price-card{background:linear-gradient(135deg,rgba(30,30,54,.9),rgba(42,42,90,.6));border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;margin-bottom:14px;}
        .price-label{font-size:12px;color:var(--dim);}
        .price-val{font-family:'Orbitron';font-size:36px;font-weight:800;color:var(--green);}
        .price-stats{display:flex;justify-content:space-around;margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
        .ps .v{font-size:13px;font-weight:700;}.ps .l{font-size:11px;color:var(--dim);}
        .bal-row{display:flex;gap:10px;margin-bottom:14px;}
        .bal{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
        .bal-num{font-family:'Orbitron';font-size:18px;font-weight:800;color:var(--accent);}.bal-label{font-size:11px;color:var(--dim);}
        .trade-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
        .trade-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
        .input-box{width:100%;background:rgba(10,10,26,.6);border:1px solid var(--border);border-radius:10px;padding:13px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;}
        .info{background:rgba(10,10,26,.4);border-radius:8px;padding:10px;margin-bottom:10px;}
        .info-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
        .info-row .l{color:var(--dim);}.info-row .v{font-weight:600;}
        .btn-buy{width:100%;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
        .btn-sell{width:100%;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

    <div class="price-card">
        <div class="price-label" data-i18n="ace_price">ACE价格</div>
        <div class="price-val">0.1 <span style="font-size:16px">U</span></div>
        <div style="color:var(--green);font-size:13px">+2.3% (24h)</div>
        <div class="price-stats">
            <div class="ps"><div class="v">8,500U</div><div class="l" data-i18n="pool">底池</div></div>
            <div class="ps"><div class="v">15,000</div><div class="l" data-i18n="burned">已销毁</div></div>
            <div class="ps"><div class="v">9,985,000</div><div class="l" data-i18n="total_supply">总量</div></div>
        </div>
    </div>

    <div class="bal-row">
        <div class="bal"><div class="bal-num">2,000</div><div class="bal-label">ACE</div></div>
        <div class="bal"><div class="bal-num">500U</div><div class="bal-label">USDT</div></div>
    </div>

    <div class="trade-card">
        <div class="trade-title" style="color:var(--green)"><i class="ph-fill ph-arrow-down-left"></i> <span data-i18n="buy_ace">买入ACE</span></div>
        <input type="number" class="input-box" data-i18n-ph="pay_amount" placeholder="USDT 金额">
        <div class="info">
            <div class="info-row"><span class="l" data-i18n="expected_gain">预计获得</span><span class="v" style="color:var(--green)">-- ACE</span></div>
            <div class="info-row"><span class="l">1 ACE =</span><span class="v">0.1 U</span></div>
        </div>
        <button class="btn-buy" data-i18n="buy_ace">买入ACE</button>
    </div>

    <div class="trade-card">
        <div class="trade-title" style="color:var(--red)"><i class="ph-fill ph-arrow-up-right"></i> <span data-i18n="sell_ace">卖出ACE</span></div>
        <input type="number" class="input-box" data-i18n-ph="sell_ace" placeholder="ACE 数量">
        <div class="info">
            <div class="info-row"><span class="l" data-i18n="expected_gain">预计获得</span><span class="v" style="color:var(--green)">-- USDT</span></div>
            <div class="info-row"><span class="l" data-i18n="fee">手续费(2%)</span><span class="v">0.1 U</span></div>
            <div class="info-row"><span class="l" data-i18n="burn_share">销毁1.5%</span><span class="v">0.08 U</span></div>
            <div class="info-row"><span class="l" data-i18n="charity_share">公益0.5%</span><span class="v">0.02 U</span></div>
        </div>
        <button class="btn-sell" data-i18n="sell_ace">卖出ACE</button>
    </div>
</div>

<script src="i18n.js"></script>
<script src="frame.js"></script>
<script>initFrame('trade','trade');</script>
</body>
</html>
