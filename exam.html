<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 考试</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.95),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;}
        .icon{font-size:48px;color:var(--accent);}
        .title{font-size:20px;font-weight:800;margin:10px 0;}
        .info{text-align:left;background:rgba(10,10,26,.4);border-radius:10px;padding:14px;margin:14px 0;}
        .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
        .row .l{color:var(--dim);}.row .v{font-weight:600;}
        .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:14px 32px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;}
        .back-link{color:var(--accent);font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-top:12px;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div class="card">
        <div class="icon"><i class="ph-fill ph-exam"></i></div>
        <div class="title" data-i18n="take_exam">综合考试</div>
        <div class="info">
            <div class="row"><span class="l" data-i18n="question_count">题目数量</span><span class="v">10题</span></div>
            <div class="row"><span class="l" data-i18n="passing_score">及格分数</span><span class="v">70分</span></div>
            <div class="row"><span class="l" data-i18n="exam_duration">考试时长</span><span class="v">20分钟</span></div>
        </div>
        <button class="btn" data-i18n="start_exam">开始考试</button>
    </div>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script>initFrame('exam','learn');</script>
</body>
</html>
