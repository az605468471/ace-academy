<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 推广中心</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
        .role{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:12px;}
        .ref-box{background:rgba(10,10,26,.5);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:8px;align-items:center;}
        .ref{flex:1;font-size:11px;color:var(--accent);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .copy-btn{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
        .inc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
        .inc .n{font-family:'Orbitron';font-size:20px;font-weight:800;color:var(--green);}
        .inc.w .n{color:var(--accent);}.inc .l{font-size:11px;color:var(--dim);margin-top:2px;}
        .team{background:rgba(10,10,26,.4);border-radius:10px;padding:12px;}
        .tr{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;}
        .tr .l{color:var(--dim);}.tr .v{font-weight:600;color:#fff;}
        .level-bar{background:rgba(10,10,26,.4);border-radius:10px;padding:12px;margin-top:10px;}
        .lvl{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:8px;}
        .lvl-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;}
        .btn-up{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:15px;font-weight:700"><i class="ph-fill ph-megaphone"></i> 推广中心</div>
        <button class="copy-btn" style="background:linear-gradient(135deg,var(--accent),var(--accent2))" onclick="dappPromoConnect()"><i class="ph ph-plug"></i> <span id="promoConn">连接钱包</span></button>
    </div>
    <div class="card" style="text-align:center">
        <div class="role"><i class="ph-fill ph-star"></i> <span id="promoRole">大使</span> · <span id="promoLevel" data-i18n="level_learner">学者</span></div>
        <div style="font-size:12px;color:var(--dim)"><span id="promoDirect">--</span>直推 · 团队<span id="promoTeamCount">--</span>人</div>
    </div>

    <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:10px"><i class="ph-fill ph-link"></i> <span data-i18n="my_ref_link">我的推荐链接</span></div>
        <div class="ref-box">
            <div class="ref" id="promoLink">连接钱包后生成推荐链接</div>
            <button class="copy-btn" onclick="copyLink()"><i class="ph-fill ph-copy"></i> <span data-i18n="copy">复制</span></button>
        </div>
    </div>

    <div class="grid2">
        <div class="inc"><div class="n" id="promoIncome">--</div><div class="l" data-i18n="income">收入</div></div>
        <div class="inc w"><div class="n" id="promoTeamAce" style="color:var(--accent)">--</div><div class="l">团队分成(ACE)</div></div>
    </div>

    <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:10px"><i class="ph-fill ph-users-three"></i> <span data-i18n="team">团队数据</span></div>
        <div class="team">
            <div class="tr"><span class="l" data-i18n="direct_referrals">直推人数</span><span class="v" id="tDirect">--</span></div>
            <div class="tr"><span class="l" data-i18n="team_members">团队总人数</span><span class="v" id="tMembers">--</span></div>
            <div class="tr"><span class="l" data-i18n="team_rev">团队业绩</span><span class="v" id="tRev">--</span></div>
            <div class="tr"><span class="l" data-i18n="current_level">当前级别</span><span class="v" id="tLevel">--</span></div>
        </div>
        <div class="level-bar">
            <div style="font-size:12px;color:var(--dim)"><span data-i18n="next_level">下一级</span>：<span id="tNext">--</span></div>
            <div class="lvl"><div class="lvl-fill" id="tLevelBar" style="width:0%"></div></div>
        </div>
        <button class="btn-up" onclick="alert('升级由链上团队业绩自动触发')"><span data-i18n="upgrade_to">升级为</span> <span id="tNextBtn">--</span></button>
    </div>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="contracts-config.js"></script>
<script src="contracts-abi.js"></script>
<script src="dapp-tool.js"></script>
<script src="pricing-config.js"></script>
<script>
initFrame('promote','promote');
(function(){
    if (currentWallet) {
        document.getElementById('promoConn').textContent = currentWallet.slice(0,8)+'...'+currentWallet.slice(-4);
        document.getElementById('promoLink').textContent = location.origin + '/login.html?ref=' + currentWallet;
        loadPromoData(currentWallet);
    }
})();
const LEVELS = ['学者','导师','学士','硕士','院长'];
const LEVEL_KEYS = ['level_learner','level_mentor','level_scholar','level_master','level_chancellor'];

async function dappPromoConnect() {
    const account = await dappConnect();
    if (!account) return;
    dappSetAccount(account);
    document.getElementById('promoConn').textContent = account.slice(0,8)+'...'+account.slice(-4);
    // 推荐链接
    document.getElementById('promoLink').textContent = location.origin + '/login.html?ref=' + account;
    await loadPromoData(account);
}

async function loadPromoData(wallet) {
    try {
        const st = await dappRead('Referral','getTeamStats', wallet);
        // personalUSD, teamUSD, teamCount, level, isPromoter, isPartner
        const personal = Number(ethers.utils.formatEther(st[0]));
        const teamUSD = Number(ethers.utils.formatEther(st[1]));
        const teamCount = Number(st[2]);
        const level = Number(st[3]);
        const isPromoter = st[4];
        const directCount = await dappRead('Referral','getDirectCount', wallet);

        document.getElementById('promoDirect').textContent = String(directCount);
        document.getElementById('promoTeamCount').textContent = String(teamCount);
        document.getElementById('tDirect').textContent = directCount + '人';
        document.getElementById('tMembers').textContent = teamCount + '人';
        document.getElementById('tRev').textContent = teamUSD.toFixed(2) + 'U';
        document.getElementById('tLevel').textContent = LEVELS[level] || '—';
        document.getElementById('promoLevel').textContent = LEVELS[level] || '学者';
        document.getElementById('tNext').textContent = (level < 4 ? LEVELS[level+1] : '已达最高级');
        document.getElementById('tNextBtn').textContent = (level < 4 ? LEVELS[level+1] : '—');
        // 等级进度(简化: 用团队人数/业绩按等级门槛)
        const reqs = [[3,0],[20,5000],[100,30000],[500,150000],[2000,500000]];
        if (level < 4) {
            const [rc, ru] = reqs[level];
            const pct = Math.min(100, Math.round((teamCount/rc)*50 + (teamUSD/ru)*50));
            document.getElementById('tLevelBar').style.width = Math.min(100,pct)+'%';
        } else {
            document.getElementById('tLevelBar').style.width = '100%';
        }
    } catch(e) { console.error(e); }
}
function copyLink(){
    const link = document.getElementById('promoLink').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(link);
    alert('推荐链接已复制');
}
</script>
</body>
</html>
