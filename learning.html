<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 学习</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;}
        .progress-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
        .progress-num{font-family:'Orbitron';font-size:26px;font-weight:800;color:var(--accent);}
        .progress-num span{font-size:14px;color:var(--dim);}
        .bar{height:8px;background:#333;border-radius:4px;margin-top:12px;overflow:hidden;}
        .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;}
        .mini-stats{display:flex;gap:10px;margin-bottom:14px;}
        .mini{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
        .mini-num{font-family:'Orbitron';font-size:18px;font-weight:800;color:var(--accent);}
        .mini-label{font-size:11px;color:var(--dim);margin-top:2px;}
        .sec-title{font-size:15px;font-weight:700;margin:16px 0 10px;}
        .course-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
        .course-item.done{opacity:.6;border-color:var(--green);}
        .course-item.current{border-color:var(--accent);}
        .course-info .t{font-size:13px;font-weight:600;}
        .course-info .d{font-size:11px;color:var(--dim);margin-top:2px;}
        .status{font-size:11px;font-weight:600;}
        .status.done{color:var(--green);}.status.lock{color:var(--dim);}
        .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;}
        .exam-btn{display:block;width:100%;background:linear-gradient(135deg,var(--accent2),#7c3aed);color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
        /* 学习规划师入口卡 */
        .planner-card{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(139,137,255,.15));border:1px solid var(--accent);border-radius:14px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
        .planner-info .t{font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;}
        .planner-info .d{font-size:12px;color:var(--dim);margin-top:4px;}
        .planner-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
        .planner-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;box-shadow:0 4px 16px rgba(139,137,255,.35);}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="sec-title" style="margin:0"><i class="ph-fill ph-wallet"></i> 学习中心</div>
        <button class="btn" style="width:auto;padding:8px 16px;margin:0" onclick="dappLearnConnect()"><i class="ph ph-plug"></i> <span id="learnConnText">连接钱包</span></button>
    </div>
    <div class="planner-card" onclick="location.href='ai-planner.html'">
        <div class="planner-icon"><i class="ph-fill ph-sparkle"></i></div>
        <div class="planner-info">
            <div class="t"><span data-i18n="ai_planner">专属学习规划师</span></div>
            <div class="d" data-i18n="ai_planner_desc">定制专属学习路径 · 快速拿到证书</div>
        </div>
        <button class="planner-btn" data-i18n="ai_planner_start">开始规划</button>
    </div>
    <div class="progress-card">
        <div class="progress-num"><span data-i18n="learning_progress">学习进度</span> <span id="learnProgress">--</span></div>
        <div class="bar"><div class="bar-fill" id="learnBar" style="width:0%"></div></div>
    </div>
    <div class="mini-stats">
        <div class="mini"><div class="mini-num" id="learnCourses">--</div><div class="mini-label" data-i18n="learned">已购课程</div></div>
        <div class="mini"><div class="mini-num" id="learnAce">--</div><div class="mini-label">已释放ACE</div></div>
        <div class="mini"><div class="mini-num" id="learnPct">--</div><div class="mini-label" data-i18n="tokens_released">已释放</div></div>
    </div>
    <div class="sec-title" data-i18n="course_list">课程列表</div>
    <div id="learnCourseList"><div style="color:var(--dim);font-size:13px;padding:10px 0">连接钱包查看已购课程</div></div>
    <button class="exam-btn" style="background:linear-gradient(135deg,#8b89ff,#6366f1)" onclick="location.href='credits.html'"><i class="ph-fill ph-notebook"></i> <span data-i18n="credit_total">修读档案</span></button>
    <button class="exam-btn" onclick="location.href='exam.html'"><i class="ph-fill ph-exam"></i> <span data-i18n="take_exam">参加考试</span></button>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="contracts-config.js"></script>
<script src="contracts-abi.js"></script>
<script src="dapp-tool.js"></script>
<script>
initFrame('learning','learn');
const LEARN_DIRECTIONS = { ai: ['AI人人通','ChatGPT实战','AI做图片','AI做视频','AI办公'], block: ['区块链入门','钱包使用','DeFi基础','智能合约','NFT'], ecom: ['跨境电商入门','选品策略','店铺运营','物流支付','TikTok'], mkt: ['营销思维','社媒运营','内容创作','私域','数据分析'], code: ['编程思维','Python','网页制作','AI编程','项目实战'] };
async function dappLearnConnect() {
    const account = await dappConnect();
    if (!account) return;
    dappSetAccount(account);
    const c = document.getElementById('learnConnText'); if (c) c.textContent = account.slice(0,8)+'...'+account.slice(-4);
    await loadLearnData(account);
}
async function loadLearnData(wallet) {
    try {
        const ace = await dappAceBalance(wallet);
        document.getElementById('learnAce').textContent = Math.floor(Number(ace.eth));
        let alloc=0, release=0, exams=0, completed=0;
        try {
            const s = await dappRead('Course','getStudentInfo', wallet);
            alloc = Number(ethers.utils.formatEther(s.aceAllocated));
            release = Number(ethers.utils.formatEther(s.aceReleased));
            completed = Number(s.coursesCompleted); exams = s.examPassed ? 1 : 0;
        } catch(e) {}
        const pct = alloc>0 ? Math.min(100, Math.round(release/alloc*100)) : 0;
        document.getElementById('learnProgress').textContent = completed + '/5';
        document.getElementById('learnBar').style.width = pct+'%';
        document.getElementById('learnPct').textContent = pct+'%';
        document.getElementById('learnCourses').textContent = completed;
        renderLearnCourses(wallet, alloc, completed, exams);
    } catch(e) { console.error(e); }
}
function renderLearnCourses(wallet, alloc, completed, exams) {
    const box = document.getElementById('learnCourseList');
    if (alloc <= 0) {
        box.innerHTML = '<div style="color:var(--dim);font-size:13px;padding:12px 0">暂无已购课程，请先购买方向</div><button class="btn" style="width:100%;margin-top:8px" onclick="location.href=\'course-library.html\'">去选课</button>';
        return;
    }
    let h='';
    LEARN_DIRECTIONS.ai.forEach((name, i)=>{
        const done = i < completed, cur = i === completed;
        h += `<div class="course-item ${done?'done':cur?'current':''}" style="align-items:flex-start"><div class="course-info"><div class="t">${name}</div><div class="d">${done?'已完成':cur?'进行中':'未解锁'}</div></div>${done?'<span class="status done">✓</span>':cur?'<button class="btn" onclick="startCourse()">开始学习</button>':'<span class="status lock">未解锁</span>'}</div>`;
    });
    box.innerHTML = h;
}
function startCourse(){ alert('课程内容接入中，可先学习规划/考试'); }
</script>
</body>
</html>
