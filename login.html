<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 登录</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --bg:#080816; --card:rgba(20,20,40,0.8); --border:rgba(139,137,255,0.15); --accent:#8b89ff; --accent2:#7c3aed; --green:#4ade80; --red:#f87171; --text:#e0e0e0; --dim:#666; }
        body { font-family:'Noto Sans SC',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
        .bg-img { position:fixed; top:0; left:0; right:0; bottom:0; z-index:0; background:url('images/login-bg.png') center/cover; opacity:0.18; }
        .bg-grad { position:fixed; top:0; left:0; right:0; bottom:0; z-index:1; background:linear-gradient(180deg,rgba(8,8,22,0.5),rgba(8,8,22,0.95)); }
        .wrap { position:relative; z-index:10; min-height:100vh; max-width:500px; margin:0 auto; display:flex; flex-direction:column; padding:20px; }

        /* 顶部栏 */
        .top-bar { display:flex; align-items:center; justify-content:space-between; padding:10px 0 20px; }
        .top-left { display:flex; align-items:center; gap:10px; }
        .top-logo { width:40px; height:40px; border-radius:10px; }
        .back-link { color:var(--accent); font-size:13px; text-decoration:none; display:flex; align-items:center; gap:4px; }

        /* 卡片 */
        .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:28px 24px; backdrop-filter:blur(14px); }

        /* Tab */
        .tabs { display:flex; background:rgba(10,10,26,0.6); border-radius:12px; padding:4px; margin-bottom:20px; }
        .tab { flex:1; text-align:center; padding:10px; font-size:14px; font-weight:600; color:var(--dim); cursor:pointer; border-radius:10px; transition:all 0.3s; }
        .tab.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }

        /* 步骤 */
        .steps { display:flex; justify-content:center; gap:6px; margin-bottom:16px; }
        .step { width:24px; height:4px; border-radius:2px; background:#333; }
        .step.active { background:var(--accent); }
        .step.done { background:var(--green); }
        .step-label { text-align:center; font-size:13px; color:var(--accent); margin-bottom:16px; font-weight:500; }

        /* 表单 */
        .input-group { margin-bottom:14px; }
        .input-label { font-size:12px; color:var(--dim); margin-bottom:6px; }
        .input-box { width:100%; background:rgba(10,10,26,0.6); border:1px solid var(--border); border-radius:10px; padding:14px; color:#fff; font-size:14px; font-family:monospace; outline:none; }
        .input-box:focus { border-color:var(--accent); }
        .hint { font-size:12px; color:var(--dim); line-height:1.5; margin-bottom:14px; }

        /* 滑动验证 */
        .puzzle-track { height:44px; background:rgba(30,30,54,0.8); border-radius:22px; position:relative; overflow:hidden; border:1px solid var(--border); }
        .puzzle-fill { position:absolute; top:0; left:0; bottom:0; width:0%; background:rgba(139,137,255,0.3); border-radius:22px; }
        .puzzle-slider { position:absolute; top:2px; left:2px; width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:50%; cursor:grab; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 12px rgba(139,137,255,0.4); z-index:2; user-select:none; }
        .puzzle-slider i { color:#fff; font-size:16px; }
        .puzzle-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:13px; color:var(--dim); white-space:nowrap; }
        .puzzle-text.hidden { display:none; }
        .puzzle-success { display:none; text-align:center; color:var(--green); font-size:14px; font-weight:600; padding:8px; }
        .puzzle-success.show { display:block; }
        .puzzle-track.success { border-color:var(--green); }
        .puzzle-track.success .puzzle-slider { background:linear-gradient(135deg,var(--green),#22c55e); }

        /* 按钮 */
        .btn-primary { width:100%; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; padding:15px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:14px; }
        .btn-primary:disabled { background:#333; color:#555; cursor:not-allowed; }
        .btn-cancel { width:100%; background:transparent; color:var(--dim); border:none; padding:12px; font-size:13px; cursor:pointer; font-family:inherit; }

        /* 需求区 */
        .phase { display:none; }
        .phase.active { display:block; }
        .bind-box { background:rgba(139,137,255,0.1); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
        .bind-row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
        .bind-row span:first-child { color:var(--dim); }
        .bind-row span:last-child { color:#fff; font-family:monospace; font-weight:600; }

        /* 弹窗 */
        .overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:999; display:none; align-items:center; justify-content:center; padding:20px; }
        .overlay.show { display:flex; }
        .modal { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:28px; max-width:380px; width:100%; text-align:center; }
        .modal-icon { font-size:44px; color:var(--accent); margin-bottom:12px; }
        .modal-title { font-size:16px; font-weight:700; margin-bottom:8px; }
        .modal-desc { font-size:13px; color:var(--dim); line-height:1.6; margin-bottom:12px; }
        .modal-btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; margin:4px; }
        .modal-btn.cancel { background:transparent; color:var(--dim); }
        .modal-list { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
        .wallet-opt { background:rgba(10,10,26,0.6); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; }
        .wallet-opt:hover { border-color:var(--accent); }
        .wallet-opt i { font-size:22px; }
        .success-check { width:72px; height:72px; margin:0 auto 16px; border-radius:50%; background:rgba(74,222,128,0.15); display:flex; align-items:center; justify-content:center; }
        .success-check i { font-size:36px; color:var(--green); }

        /* 底部 */
        .footer-info { text-align:center; margin-top:16px; font-size:11px; color:var(--dim); line-height:1.6; }
    </style>
</head>
<body>
<div class="bg-img"></div>
<div class="bg-grad"></div>

<div class="wrap">

    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="top-left">
            <img src="images/ace-logo.png" class="top-logo">
            <span style="font-family:'Orbitron';font-size:16px;font-weight:800;letter-spacing:1px">ACE ACADEMY</span>
        </div>
        <a href="index.html" class="back-link"><i class="ph ph-arrow-left"></i> <span data-i18n="back">返回</span></a>
    </div>

    <!-- Tab切换 -->
    <div class="card">
        <div class="tabs">
            <div class="tab active" id="tabRegister" onclick="switchTab('register')" data-i18n="register">注册</div>
            <div class="tab" id="tabLogin" onclick="switchTab('login')" data-i18n="login">登录</div>
        </div>

        <!-- 注册流程 -->
        <div id="registerSection">
            <div class="steps">
                <div class="step active" id="reg-s1"></div><div class="step" id="reg-s2"></div><div class="step" id="reg-s3"></div><div class="step" id="reg-s4"></div>
            </div>
            <div class="step-label" id="regStepLabel" data-i18n="step1">输入推荐人地址</div>

            <!-- 步骤1:推荐人 -->
            <div class="phase active" id="regPhase1">
                <div class="input-group">
                    <div class="input-label" data-i18n="ref_address">推荐人钱包地址</div>
                    <input type="text" class="input-box" id="refInput" data-i18n-ph="ref_placeholder" placeholder="输入推荐人地址 0x..." oninput="checkRefInput()">
                </div>
                <div class="hint">
                    <i class="ph ph-info"></i> <span data-i18n="ref_required">必须通过推荐人邀请注册</span><br>
                    <span data-i18n="ref_auto">有推荐链接会自动填入</span>
                </div>
                <button class="btn-primary" id="refNextBtn" disabled onclick="goPhase('register',2)"><span data-i18n="next">下一步</span></button>
            </div>

            <!-- 步骤2:验证 -->
            <div class="phase" id="regPhase2">
                <div class="input-label" style="margin-bottom:10px" data-i18n="step2">安全验证</div>
                <div class="puzzle-track" id="regPuzzle">
                    <div class="puzzle-fill" id="regFill"></div>
                    <div class="puzzle-text" id="regText" data-i18n="slide_verify">向右滑动完成验证</div>
                    <div class="puzzle-slider" id="regSlider"><i class="ph-fill ph-arrow-right"></i></div>
                </div>
                <div class="puzzle-success" id="regSuccess"><i class="ph-fill ph-check-circle"></i> <span data-i18n="verified">验证通过</span></div>
                <button class="btn-primary" id="regVerifyBtn" disabled onclick="goPhase('register',3)"><span data-i18n="next">下一步</span></button>
            </div>

            <!-- 步骤3:钱包 -->
            <div class="phase" id="regPhase3">
                <div class="bind-box">
                    <div class="bind-row"><span data-i18n="referrer">推荐人</span><span id="confirmRef">--</span></div>
                </div>
                <div class="input-label" style="margin-bottom:10px" data-i18n="step3">连接钱包</div>
                <button class="btn-primary" onclick="connectWallet('register')"><i class="ph-fill ph-wallet"></i> <span data-i18n="connect_wallet">连接钱包并授权</span></button>
            </div>

            <!-- 步骤4:成功 -->
            <div class="phase" id="regPhase4" style="text-align:center">
                <div class="success-check" style="margin:0 auto 16px"><i class="ph-fill ph-check-circle"></i></div>
                <div class="modal-title" style="font-size:20px" data-i18n="reg_success">注册成功</div>
                <div class="bind-box" style="text-align:left;margin-top:12px">
                    <div class="bind-row"><span data-i18n="wallet_addr">钱包地址</span><span id="regWallet">--</span></div>
                    <div class="bind-row"><span data-i18n="user_id">用户ID</span><span id="regUid">--</span></div>
                    <div class="bind-row"><span data-i18n="referrer">推荐人</span><span id="regRef">--</span></div>
                    <div class="bind-row"><span data-i18n="bound">已绑定</span><span style="color:var(--green)">✓</span></div>
                </div>
                <button class="btn-primary" onclick="enterPlatform()"><span data-i18n="enter_platform">进入学习</span></button>
            </div>
        </div>

        <!-- 登录流程 -->
        <div id="loginSection" style="display:none">
            <div class="steps">
                <div class="step active" id="log-s1"></div><div class="step" id="log-s2"></div><div class="step" id="log-s3"></div>
            </div>
            <div class="step-label" id="logStepLabel" data-i18n="step2">安全验证</div>

            <!-- 步骤1:验证 -->
            <div class="phase active" id="logPhase1">
                <div class="input-label" style="margin-bottom:10px" data-i18n="step2">安全验证</div>
                <div class="puzzle-track" id="logPuzzle">
                    <div class="puzzle-fill" id="logFill"></div>
                    <div class="puzzle-text" id="logText">向右滑动完成验证</div>
                    <div class="puzzle-slider" id="logSlider"><i class="ph-fill ph-arrow-right"></i></div>
                </div>
                <div class="puzzle-success" id="logSuccess"><i class="ph-fill ph-check-circle"></i> <span data-i18n="verified">验证通过</span></div>
                <button class="btn-primary" id="logVerifyBtn" disabled onclick="goPhase('login',2)"><span data-i18n="next">下一步</span></button>
            </div>

            <!-- 步骤2:钱包连接 -->
            <div class="phase" id="logPhase2">
                <div class="input-label" style="margin-bottom:10px" data-i18n="step3">连接钱包</div>
                <button class="btn-primary" onclick="connectWallet('login')"><i class="ph-fill ph-wallet"></i> <span data-i18n="connect_wallet">连接钱包</span></button>
            </div>

            <!-- 步骤3:签名 -->
            <div class="phase" id="logPhase3" style="text-align:center">
                <div class="bind-box" style="text-align:left;margin-bottom:14px">
                    <div class="bind-row"><span data-i18n="wallet_addr">钱包地址</span><span id="loginWallet">--</span></div>
                </div>
                <button class="btn-primary" id="loginSignBtn" onclick="signLogin()"><i class="ph-fill ph-fingerprint"></i> <span data-i18n="sign_to_login">签名授权登录</span></button>
            </div>
        </div>
    </div>

    <div class="footer-info">
        钱包地址即账户 · 无需邮箱密码<br>
        <span data-i18n="brand_name">王牌学院</span> · ACE Academy
    </div>
</div>

<!-- 钱包选择弹窗 -->
<div class="overlay" id="walletOverlay">
    <div class="modal">
        <div class="modal-icon"><i class="ph-fill ph-wallet"></i></div>
        <div class="modal-title" data-i18n="step3">连接钱包</div>
        <div class="modal-list">
            <div class="wallet-opt" onclick="pickWallet('metamask')">
                <i class="ph-fill ph-fox" style="color:#f6851b"></i>
                <div><div style="font-weight:600">MetaMask</div><div style="font-size:12px;color:var(--dim)">小狐狸钱包</div></div>
            </div>
            <div class="wallet-opt" onclick="pickWallet('tp')">
                <i class="ph-fill ph-circle" style="color:#3478f6"></i>
                <div><div style="font-weight:600">TokenPocket</div><div style="font-size:12px;color:var(--dim)">TP钱包</div></div>
            </div>
            <div class="wallet-opt" onclick="pickWallet('wc')">
                <i class="ph-fill ph-qr-code" style="color:#3b99fc"></i>
                <div><div style="font-weight:600">WalletConnect</div><div style="font-size:12px;color:var(--dim)">扫码连接</div></div>
            </div>
        </div>
        <button class="modal-btn cancel" onclick="closeOverlay('walletOverlay')"><span data-i18n="cancel">取消</span></button>
    </div>
</div>

<!-- 授权弹窗 -->
<div class="overlay" id="signOverlay">
    <div class="modal">
        <div class="modal-icon" id="signIcon"><i class="ph-fill ph-fingerprint"></i></div>
        <div class="modal-title" id="signTitle">等待钱包确认</div>
        <div class="modal-desc" id="signDesc">请在钱包中确认</div>
        <button class="modal-btn cancel" onclick="closeOverlay('signOverlay')"><span data-i18n="cancel">取消</span></button>
    </div>
</div>

<!-- 成功弹窗 -->
<div class="overlay" id="successOverlay">
    <div class="modal">
        <div class="success-check"><i class="ph-fill ph-check-circle"></i></div>
        <div class="modal-title" style="font-size:20px" data-i18n="login_success">登录成功</div>
        <div class="modal-desc" data-i18n="welcome_back">欢迎回到王牌学院</div>
        <button class="modal-btn" onclick="enterPlatform()"><span data-i18n="enter_platform">进入学习</span></button>
    </div>
</div>

<script src="i18n.js"></script>
<!-- Ethers + 合约配置 -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="contracts-config.js"></script>
<script src="contracts-abi.js"></script>
<script src="dapp-tool.js"></script>
<script>
let curTab = 'register', regVerified = false, logVerified = false, walletMode = '', walletConnected = false;

function switchTab(t) {
    curTab = t;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.getElementById(t === 'register' ? 'tabRegister' : 'tabLogin').classList.add('active');
    document.getElementById('registerSection').style.display = t === 'register' ? 'block' : 'none';
    document.getElementById('loginSection').style.display = t === 'login' ? 'block' : 'none';
}

function goPhase(mode, phase) {
    // 注册
    if (mode === 'register') {
        if (phase === 2) { regVerified = document.getElementById('regSuccess').classList.contains('show'); }
        document.querySelectorAll('#registerSection .phase').forEach((p,i) => p.classList.toggle('active', i === phase-1));
        document.querySelectorAll('#registerSection .step').forEach((s,i) => {
            s.className = 'step ' + (i < phase-1 ? 'done' : i === phase-1 ? 'active' : '');
        });
        document.getElementById('regStepLabel').setAttribute('data-i18n', 'step'+phase);
        document.getElementById('regStepLabel').textContent = t(['','step1','step2','step3','step4'][phase]);
        if (phase === 3) document.getElementById('confirmRef').textContent = document.getElementById('refInput').value.slice(0,10)+'...';
        if (phase === 4) {
            const w = currentWallet || '0x...';
            document.getElementById('regWallet').textContent = w.slice(0,8)+'...'+w.slice(-4);
            document.getElementById('regUid').textContent = (w ? w.slice(0,8) : '10') + '001';
            document.getElementById('regRef').textContent = (document.getElementById('refInput').value || '—').slice(0,10)+'...';
        }
    } else { // 登录
        document.querySelectorAll('#loginSection .phase').forEach((p,i) => p.classList.toggle('active', i === phase-1));
        document.querySelectorAll('#loginSection .step').forEach((s,i) => {
            s.className = 'step ' + (i < phase-1 ? 'done' : i === phase-1 ? 'active' : '');
        });
        document.getElementById('logStepLabel').textContent = t(['','step2','step3','sign_to_login'][phase]);
        if (phase === 3) {
            const w = currentWallet || '0x';
            document.getElementById('loginWallet').textContent = w.slice(0,8)+'...'+(w && w.slice(-4));
        }
    }
}

function checkRefInput() {
    const v = document.getElementById('refInput').value.trim();
    document.getElementById('refNextBtn').disabled = !(v.startsWith('0x') && v.length >= 42);
}

function connectWallet(mode) {
    walletMode = mode;
    document.getElementById('walletOverlay').classList.add('show');
}

async function pickWallet() {
    closeOverlay('walletOverlay');
    // 真实连接钱包
    const account = await dappConnect();
    if (!account) {
        document.getElementById('signOverlay').classList.add('show');
        document.getElementById('signIcon').innerHTML = '<i class="ph-fill ph-wallet"></i>';
        document.getElementById('signIcon').style.color = 'var(--red)';
        document.getElementById('signTitle').textContent = '连接失败';
        document.getElementById('signDesc').textContent = '请在 TP/MetaMask 钱包内置浏览器中打开并授权';
        return;
    }
    dappSetAccount(account);
    localStorage.setItem('ace_wallet', account);  // 持久化钱包地址
    walletConnected = true;

    document.getElementById('signOverlay').classList.add('show');
    document.getElementById('signIcon').innerHTML = '<i class="ph-fill ph-check-circle"></i>';
    document.getElementById('signIcon').style.color = 'var(--green)';
    document.getElementById('signTitle').textContent = walletMode === 'register' ? '钱包已连接' : '钱包连接成功';
    document.getElementById('signDesc').textContent = account.slice(0,8)+'...'+account.slice(-4);

    if (walletMode === 'register') {
        // 真实注册: 绑定推荐关系
        try {
            const refInput = (document.getElementById('refInput').value || '').trim();
            if (refInput && refInput.startsWith('0x')) {
                const rf = dappC('Referral');
                const existing = await rf.referrer(account);
                if (existing === '0x0000000000000000000000000000000000000000') {
                    const c = dappC('Referral', true);
                    const tx = await c.registerReferral(account, refInput);
                    await tx.wait();
                }
            }
        } catch(e) {
            console.warn('注册推荐未完成(可能已有推荐人或参数问题)', e);
        }
    }

    setTimeout(() => {
        closeOverlay('signOverlay');
        if (walletMode === 'register') { goPhase('register', 4); }
        else { void checkLoginMember(account); }
    }, 800);
}

// 登录: 连接钱包后检查是否老会员
async function checkLoginMember(wallet) {
    if (walletMode !== 'login') return;
    let ref = '0x0000000000000000000000000000000000000000';
    let paid = 0;
    // 用钱包 provider 读取(可靠快速)，并加超时保护
    const walletP = dappProvider();
    const refC = new ethers.Contract(CONTRACT_CONFIG.contracts.Referral, CONTRACT_ABIS.Referral, walletP);
    const courseC = new ethers.Contract(CONTRACT_CONFIG.contracts.Course, CONTRACT_ABIS.Course, walletP);
    const timeout = p => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 8000))]);
    try { ref = (await timeout(refC.referrer(wallet))); } catch(e){}
    try { const s = await timeout(courseC.getStudentInfo(wallet)); paid = Number(s.totalPaid); } catch(e){}
    const isMember = ref !== '0x0000000000000000000000000000000000000000' || paid > 0 ||
        CONTRACT_CONFIG.wallets.ownerFund.toLowerCase()===wallet.toLowerCase() ||
        CONTRACT_CONFIG.wallets.promo.toLowerCase()===wallet.toLowerCase();
    if (isMember) {
        goPhase('login', 3);
    } else {
        alert('该钱包未注册为会员，请通过推荐链接注册');
        switchTab('register');
    }
}

function signLogin() {
    // 强制验证已连接钱包
    if (!currentWallet) {
        alert('请先连接钱包');
        goPhase('login', 2);
        return;
    }
    // 真实签名验证 (方式A)
    document.getElementById('successOverlay').classList.remove('show');
    document.getElementById('signOverlay').classList.add('show');
    document.getElementById('signIcon').innerHTML = '<i class="ph-fill ph-fingerprint"></i>';
    document.getElementById('signIcon').style.color = '#8b89ff';
    document.getElementById('signTitle').textContent = '等待签名验证';
    document.getElementById('signDesc').textContent = '请在钱包中签名确认身份';

    (async () => {
        const msg = dappLoginMsg(currentWallet);
        const sig = await dappSignLogin(msg);
        if (sig) {
            // 签名成功 → 身份验证通过 → 登录成功
            document.getElementById('signIcon').innerHTML = '<i class="ph-fill ph-check-circle"></i>';
            document.getElementById('signIcon').style.color = 'var(--green)';
            document.getElementById('signTitle').textContent = '验证通过，登录成功';
            document.getElementById('signDesc').textContent = currentWallet.slice(0,8)+'...'+currentWallet.slice(-4);
            localStorage.setItem('ace_wallet', currentWallet);
            setTimeout(() => {
                closeOverlay('signOverlay');
                window.location.href = 'learning.html?wallet=' + currentWallet;
            }, 900);
        } else {
            closeOverlay('signOverlay');
            document.getElementById('signOverlay').classList.remove('show');
            alert('签名未完成或已取消，登录失败');
        }
    })();
}

function enterPlatform() {
    if (!currentWallet) {
        alert('连接失败，请确认钱包已授权');
        return;
    }
    localStorage.setItem('ace_wallet', currentWallet);
    window.location.href = 'learning.html?wallet=' + currentWallet;
}
function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }

// 滑动验证
function initPuzzle(p, type) {
    const track = document.getElementById(p+'Puzzle');
    const fill = document.getElementById(p=='reg'?'regFill':'logFill');
    const slider = document.getElementById(p+'Slider');
    const text = document.getElementById(p=='reg'?'regText':'logText');
    const btn = document.getElementById(p+'VerifyBtn');
    let dragging = false, startX = 0;
    function start(e){ e.preventDefault(); dragging = true; startX = e.touches?e.touches[0].clientX:e.clientX; }
    function move(e){
        if(!dragging) return;
        e.preventDefault();
        const x = e.touches?e.touches[0].clientX:e.clientX;
        const max = track.offsetWidth - 44;
        let dx = Math.max(0, Math.min(x-startX, max));
        slider.style.left = (dx+2)+'px';
        fill.style.width = (dx+44)+'px';
        if(dx >= max-5){
            track.classList.add('success'); text.classList.add('hidden');
            slider.innerHTML = '<i class="ph-fill ph-check"></i>';
            document.getElementById(p+'Success').classList.add('show');
            btn.disabled = false; dragging = false;
            if(type==='reg') regVerified=true;
        }
    }
    function end(){ dragging = false; if(!track.classList.contains('success')) { slider.style.left='2px'; fill.style.width='0%'; } }
    slider.addEventListener('mousedown', start);
    slider.addEventListener('touchstart', start, {passive:false});
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, {passive:false});
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
}
initPuzzle('reg');
initPuzzle('log');
