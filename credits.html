<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 修读档案</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;padding-bottom:80px;}
        .overview{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;text-align:center;}
        .ov-label{font-size:12px;color:var(--dim);}
        .ov-num{font-family:'Orbitron';font-size:32px;font-weight:800;color:var(--accent);margin:6px 0;}
        .ov-sub{font-size:12px;color:var(--green);}
        .progress-lab{display:flex;justify-content:space-between;font-size:12px;margin:12px 0 4px;color:var(--dim);}
        .bar{height:8px;background:#333;border-radius:4px;overflow:hidden;}
        .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;}
        .countdown{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);border-radius:12px;padding:14px;margin-bottom:14px;text-align:center;}
        .cd-title{font-size:13px;color:var(--red);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
        .cd-days{font-family:'Orbitron';font-size:24px;font-weight:800;color:var(--red);margin-top:4px;}
        .cd-note{font-size:11px;color:var(--dim);margin-top:4px;}
        .dir-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
        .dir-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .dir-name{font-size:15px;font-weight:700;}
        .dir-score{font-family:'Orbitron';font-size:18px;font-weight:800;color:var(--accent);}
        .dir-score span{font-size:11px;color:var(--dim);font-weight:400;}
        .course-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:7px 0;border-bottom:1px solid rgba(139,137,255,.05);}
        .course-row:last-child{border:none;}
        .c-ok{color:var(--green);}
        .c-doing{color:var(--yellow);}
        .c-null{color:var(--dim);}
        .tag{font-size:10px;padding:2px 6px;border-radius:4px;}
        .tag.get{background:rgba(74,222,128,.15);color:var(--green);}
        .tag.near{background:rgba(251,191,36,.15);color:var(--yellow);}
        .earning{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;}
        .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

    <div class="overview">
        <div class="ov-label" data-i18n="credit_total">总学分</div>
        <div class="ov-num">82 / 500</div>
        <div class="ov-sub">全科王牌认证：需 400/500（80%）</div>
    </div>
    <div class="progress-lab"><span data-i18n="credit_progress">整体进度</span><span>82 / 500</span></div>
    <div class="bar"><div class="bar-fill" style="width:16.4%"></div></div>

    <div class="countdown">
        <div class="cd-title"><i class="ph-fill ph-alarm"></i> <span data-i18n="learn_deadline">学习周期截止</span></div>
        <div class="cd-days">45 <span style="font-size:13px" data-i18n="days_left">天后</span></div>
        <div class="cd-note" data-i18n="delay_hint">到期未修满80学分，未释放代币将降速（每月10%→5%）</div>
    </div>

    <div class="dir-card">
        <div class="dir-head">
            <div class="dir-name" data-i18n="dir_ai">AI应用</div>
            <div class="dir-score">82 <span>/100</span> <span class="tag get">可拿证</span></div>
        </div>
        <div class="course-row"><span>AI人人通</span><span class="c-ok">20分 ✓</span></div>
        <div class="course-row"><span>ChatGPT实战</span><span class="c-ok">20分 ✓</span></div>
        <div class="course-row"><span>AI做图片</span><span class="c-ok">20分 ✓</span></div>
        <div class="course-row"><span>AI做视频</span><span class="c-doing">16分 · 测</span></div>
        <div class="course-row"><span>AI办公</span><span class="c-null">0分</span></div>
    </div>

    <div class="dir-card">
        <div class="dir-head">
            <div class="dir-name" data-i18n="dir_block">区块链/Web3</div>
            <div class="dir-score">28 <span>/100</span> <span class="tag near">差52分</span></div>
        </div>
        <div class="course-row"><span>区块链入门</span><span class="c-ok">20分 ✓</span></div>
        <div class="course-row"><span>钱包使用</span><span class="c-ok">8分</span></div>
        <div class="course-row"><span>DeFi基础</span><span class="c-null">0分</span></div>
    </div>

    <div class="dir-card">
        <div class="dir-head">
            <div class="dir-name" data-i18n="dir_ecom">跨境电商</div>
            <div class="dir-score">0 <span>/100</span></div>
        </div>
        <div class="course-row"><span>未选课</span><span class="c-null">—</span></div>
    </div>

    <div class="earning">
        <div style="font-size:13px;font-weight:700;margin-bottom:10px"><i class="ph-fill ph-coins"></i> 学习收益</div>
        <div class="course-row"><span>代币总分配</span><span>10,000 ACE</span></div>
        <div class="course-row"><span>已释放（按学分）</span><span style="color:var(--green)">6,000 ACE</span></div>
        <div class="course-row"><span>当前释放速度</span><span style="color:var(--green)">正常 10%/月</span></div>
    </div>

    <button class="btn" onclick="location.href='learning.html'"><i class="ph-fill ph-play"></i> <span data-i18n="continue_learn">继续学习</span></button>
</div>
<script src="i18n.js"></script>
<script src="frame.js"></script>
<script>initFrame('credit','learn');</script>
</body>
</html>
