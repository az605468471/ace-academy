<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王牌学院 · 课程库</title>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#080816;--card:rgba(20,20,40,.7);--border:rgba(139,137,255,.15);--accent:#8b89ff;--accent2:#7c3aed;--green:#4ade80;--yellow:#fbbf24;--dim:#666;--text:#e0e0e0;}
        body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);}
        .bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,8,22,.9),rgba(8,8,22,1));z-index:0;}
        .wrap{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:15px;padding-bottom:80px;}
        .stats{display:flex;gap:12px;margin-bottom:14px;}
        .stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
        .stat-num{font-family:'Orbitron';font-size:20px;font-weight:800;color:var(--accent);}
        .stat-label{font-size:11px;color:var(--dim);margin-top:2px;}
        .dir-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;margin-bottom:12px;}
        .dir-tab{padding:8px 14px;border-radius:16px;background:rgba(20,20,40,.6);color:var(--dim);font-size:12px;white-space:nowrap;cursor:pointer;border:1px solid transparent;}
        .dir-tab.active{background:rgba(139,137,255,.2);color:#fff;border-color:var(--accent);}
        .dir-tab.hot::after{content:'新';background:var(--green);color:#000;font-size:9px;padding:1px 4px;border-radius:4px;margin-left:4px;}
        .course-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
        .course-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
        .course-title{font-size:14px;font-weight:700;}
        .badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;}
        .badge-easy{background:#1a3a1a;color:#4ade80;}
        .badge-mid{background:#3a3a1a;color:#fbbf24;}
        .badge-hard{background:#3a1a1a;color:#f87171;}
        .course-info{font-size:11px;color:var(--dim);margin-bottom:6px;display:flex;gap:10px;}
        .course-link{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;text-decoration:none;padding:5px 10px;background:rgba(139,137,255,.1);border-radius:6px;}
        .directions{display:none;}
        .directions.active{display:block;}
        .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;}
        .panel-title{font-size:14px;font-weight:700;margin-bottom:10px;}
        .edu-level{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(139,137,255,.05);}
        .edu-level:last-child{border:none;}
        .lvl-badge{width:36px;height:36px;border-radius:10px;background:rgba(139,137,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .lvl-badge i{color:var(--accent);font-size:18px;}
        .lvl-name{font-size:13px;font-weight:700;}
        .lvl-desc{font-size:11px;color:var(--dim);margin-top:2px;}
        .lvl-credit{font-size:11px;color:var(--green);white-space:nowrap;}
    </style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:15px;font-weight:700"><i class="ph-fill ph-books"></i> 课程库</div>
        <button class="course-link" style="background:linear-gradient(135deg,var(--accent),var(--accent2))" onclick="dappCourseConnect()"><i class="ph ph-plug"></i> <span id="courseConn">连接钱包</span></button>
    </div>

    <div class="stats">
        <div class="stat"><div class="stat-num" id="dirCount">5</div><div class="stat-label" data-i18n="stat_directions">方向</div></div>
        <div class="stat"><div class="stat-num" id="courseCount">25</div><div class="stat-label" data-i18n="stat_courses">课程</div></div>
        <div class="stat"><div class="stat-num" id="eduLevels">4</div><div class="stat-label">认证等级</div></div>
    </div>

    <div class="dir-tabs" id="dirTabs"></div>
    <div id="courseContent"></div>

    <!-- 学历教育进阶认证 -->
    <div class="panel">
        <div class="panel-title"><i class="ph-fill ph-academic-cap" style="color:var(--accent)"></i> 学历教育进阶认证</div>
        <div id="eduLevelList"></div>
    </div>

</div>
<script src="i18n.js"></script>
<script src="courses-data.js"></script>
<script src="frame.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="contracts-config.js"></script>
<script src="contracts-abi.js"></script>
<script src="dapp-tool.js"></script>
<script>
initFrame('courses','course');

// 渲染数据驱动
const lang = getLang();
const isEn = lang === 'en';

// 统计
document.getElementById('dirCount').textContent = Object.keys(DIRECTIONS).length;
let totalCourses=0;
Object.values(DIRECTIONS).forEach(d=>totalCourses+=d.courses.length);
document.getElementById('courseCount').textContent = totalCourses;
document.getElementById('eduLevels').textContent = EDUCATION_LEVELS.length;

// 渲染方向Tab
let dirKeys=Object.keys(DIRECTIONS);
let tabsHTML='';
dirKeys.forEach((k,i)=>{
    const d=DIRECTIONS[k];
    tabsHTML+=`<div class="dir-tab ${i===0?'active':''}" onclick="showDir('${k}',this)">${isEn?d.nameEn:d.name}</div>`;
});
document.getElementById('dirTabs').innerHTML=tabsHTML;

// 渲染所有方向
function renderCourses(){
    let html='';
    dirKeys.forEach(k=>{
        const d=DIRECTIONS[k];
        let dirHTML=`<div id="dir-${k}" class="directions ${k===dirKeys[0]?'active':''}">`;
        d.courses.forEach((c,idx)=>{
            const lvlBadge = c.levelEn==='Beginner'?'badge-easy':c.levelEn==='Intermediate'?'badge-mid':'badge-hard';
            const lvlName = isEn?c.levelEn:c.level;
            dirHTML+=`
            <div class="course-card">
                <div class="course-head">
                    <div class="course-title">${idx+1}. ${isEn?c.nameEn:c.name}</div>
                    <span class="badge ${lvlBadge}">${lvlName}</span>
                </div>
                <div class="course-info">
                    <span>${isEn?c.durEn:c.dur}</span>
                    <span>20学分</span>
                </div>
                <a href="${c.src}" target="_blank" class="course-link"><i class="ph-fill ph-play-circle"></i> ${isEn?'Learn':'学习'} ${c.srcName}</a>
            </div>`;
        });
        // 方向购买区
        const cid = directionCourseId(k);
        dirHTML+=`
        <div class="course-card" style="border-color:var(--accent);background:rgba(139,137,255,.06)">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <div>
                    <div style="font-size:14px;font-weight:700;color:var(--accent)">${isEn?'Buy this direction':'购买该方向'}</div>
                    <div style="font-size:11px;color:var(--dim);margin-top:4px" id="dirPrice-${k}">读取价格中...</div>
                </div>
                <button class="course-link" style="background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff" onclick="buyDirection('${k}')"><i class="ph-fill ph-shopping-cart"></i> ${isEn?'Buy':'购买'}</button>
            </div>
        </div>`;
        dirHTML+='</div>';
        html+=dirHTML;
    });
    document.getElementById('courseContent').innerHTML=html;
}
renderCourses();
// 自动恢复钱包并加载价格
(function(){
    if (currentWallet) {
        const c = document.getElementById('courseConn'); if (c) c.textContent = currentWallet.slice(0,8)+'...'+currentWallet.slice(-4);
        loadPrices(currentWallet);
    } else {
        loadPrices();
    }
})();
function showDir(k,el){
    document.querySelectorAll('.directions').forEach(d=>d.classList.remove('active'));
    document.getElementById('dir-'+k).classList.add('active');
    document.querySelectorAll('.dir-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
}

// 学历教育进阶体系
const icons=['ph-certificate','ph-medal','ph-award','ph-academic-cap'];
const levelI18n={
    micro:{zh:'微证书',en:'Micro-cert'},
    direction:{zh:'方向证书',en:'Direction Cert'},
    advanced:{zh:'进阶认证',en:'Advanced Cert'},
    degree:{zh:'学历衔接',en:'Degree Track'}
};
let eduHTML='';
EDUCATION_LEVELS.forEach((lv,i)=>{
    const name = isEn?lv.nameEn:lv.name;
    const desc = isEn?lv.descEn:lv.desc;
    const credit = lv.credit?`${lv.credit}学分`:'';
    eduHTML+=`
    <div class="edu-level">
        <div class="lvl-badge"><i class="${icons[i]}"></i></div>
        <div style="flex:1"><div class="lvl-name">${name}</div><div class="lvl-desc">${desc}</div></div>
        ${credit?`<div class="lvl-credit">${credit}</div>`:''}
    </div>`;
});
document.getElementById('eduLevelList').innerHTML=eduHTML;

// ===== 真实买课 =====
// 方向→courseId 映射(合约已添加课程1=200U,课程2=200U)
const DIR_COURSE_ID = { ai:1, block:2, ecom:1, mkt:2, code:1 };
function directionCourseId(dir){ return DIR_COURSE_ID[dir] ?? 1; }

async function dappCourseConnect() {
    const account = await dappConnect();
    if (!account) return; dappSetAccount(account);
    const c = document.getElementById('courseConn'); if (c) c.textContent = account.slice(0,8)+'...'+account.slice(-4);
    await loadPrices(account);
}

async function loadPrices(wallet) {
    try {
        const p = await dappRead('Course','acePrice');
        const priceUsdt = Number(ethers.utils.formatEther(p));
        for (const k of Object.keys(DIRECTIONS)) {
            const el = document.getElementById('dirPrice-'+k);
            if (el) el.textContent = '价格: ' + priceUsdt.toFixed(2) + ' USDT / 方向';
        }
        // 已购状态
        if (wallet) {
            try {
                const s = await dappRead('Course','getStudentInfo', wallet);
                if (Number(s.totalPaid) > 0) {
                    const pa = Number(ethers.utils.formatEther(s.totalPaid));
                    for (const k of Object.keys(DIRECTIONS)) {
                        const el = document.getElementById('dirPrice-'+k);
                        if (el) el.textContent = '已购, 累计支付 ' + pa.toFixed(2) + ' USDT';
                    }
                }
            } catch(e){}
        }
    } catch(e){ console.error(e); }
}

async function buyDirection(dir) {
    if (!currentWallet) { alert('请先连接钱包'); return; }
    const cid = directionCourseId(dir);
    // 检查是否已有推荐人
    let hasRef = false;
    try {
        const ref = await dappRead('Referral','referrer', currentWallet);
        hasRef = ref !== '0x0000000000000000000000000000000000000000';
    } catch(e){}
    if (!hasRef) { alert('请先通过推荐链接注册(绑定推荐人)后方可购买'); location.href='login.html'; return; }

    if (!confirm('确认购买该方向？将从您的 USDT 支付，并获取 ACE 奖励。')) return;
    try {
        // 读课程价格
        const courseData = await dappRead('Course','courses', cid);
        const price = courseData[0];
        // approve USDT
        const usdtC = new ethers.Contract(CONTRACT_CONFIG.usdt,
            ['function approve(address,uint256) returns (bool)'], dappProvider().getSigner());
        const ap = await usdtC.approve(CONTRACT_CONFIG.contracts.Course, price);
        await ap.wait();
        // buyCourse
        const courseC = dappC('Course', true);
        const tx = await courseC.buyCourse(cid);
        await tx.wait();
        alert('购买成功！已获 ACE 奖励，可前往学习中心查看');
        loadPrices(currentWallet);
    } catch(e) {
        console.error(e);
        alert(e.message && e.message.includes('user rejected') ? '已取消' : '购买失败:' + (e.message||'').slice(0,80));
    }
}
// 从URL定位到指定方向(规划师跳转而来)
(function(){
    const p = new URLSearchParams(location.search);
    const dir = p.get('dir');
    const w = p.get('wallet');
    if (w && currentWallet && w.toLowerCase()===currentWallet.toLowerCase()) {
        const c = document.getElementById('courseConn'); if (c) c.textContent = currentWallet.slice(0,8)+'...'+currentWallet.slice(-4);
    }
    if (dir && DIRECTIONS[dir]) {
        // 找到对应tab并激活
        const tabs = document.querySelectorAll('.dir-tab');
        const keys = Object.keys(DIRECTIONS);
        const idx = keys.indexOf(dir);
        if (idx >= 0 && tabs[idx]) {
            document.querySelectorAll('.dir-tab').forEach(t=>t.classList.remove('active'));
            tabs[idx].classList.add('active');
            showDir(dir);
        }
        if (currentWallet) loadPrices(currentWallet);
    }
})();
</script>
</body>
</html>
